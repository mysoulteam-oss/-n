  - idn: project_attributes_known_employees
    value: "*(No employees specified.)*"
    title: Known Employees [A]
    description: |-
      List names of team members callers may explicitly ask for. This helps the Agent recognize named
      colleague requests inside the existing human-handoff request category.

      **Pro-Tip:** Use clear comma-separated names and include commonly used short forms if needed.

      **Examples:**

      ```txt
      Tom, Sarah, Claire, Dr. Patel, Mike
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Injected into industry intent-type instructions where the "Manager or Human
      Request" class already exists. This extends that class with named colleagues, so requests for
      specific team members are handled alongside generic human or manager asks. In industries that
      include this class, the resulting handoff behavior is typically transfer-first during working hours
      and relay-first outside working hours.

      **Fallbacks:** If empty during initialization, the system sets a placeholder value indicating no
      employees were specified.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_industry`: Selects which industry intent map is used. Some industries (for
          example, Sales) do not define a manager/human request class that references this attribute.
        - `project_business_working_hours`: Provides the business schedule used for working-hours-aware
          transfer-vs-relay behavior when working-hours evaluation is enabled.
        - `project_business_working_hour_escalation_phone`: Baseline transfer target during working-hours
          handoff when transfer-call routing is available.
      - **Logic Interactions:**
        - `project_attributes_setting_define_conversation_is_during_working_hours_enabled`: Controls
          whether runtime working-hours status is actively evaluated for transfer-vs-relay routing.
        - `project_attributes_setting_transfer_call_enabled`: If disabled, manager/human requests use
          relay-style handling instead of call transfer.
        - `project_attributes_setting_transfer_call_phone_numbers`: If configured, these routing-specific
          numbers can override escalation-phone defaults for transfer execution.
        - `project_business_non_working_hour_escalation_phone`: Affects general off-hours transfer
          availability in transfer-call logic, but non-working-hours manager/human intent behavior is
          typically relay-first in default industry maps.
    group: 1. Business - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_setting_lead_nurturing_instructions
    value: " "
    title: Lead Nurturing - Instructions [A]
    description: |-
      This setting defines follow-up actions the system should schedule after a conversation reaches a
      successful CTA.

      Use it to describe what needs to happen next and when it should happen relative to the CTA.

      **Best Practice:** Write one action per line with clear timing, action type, and expected outcome so
      task scheduling remains predictable.

      **Examples:**

      ```txt
      Send SMS 4 hours before the booked appointment and remind the user about the visit.
      Call 1 day after booking to collect feedback and ask for complaints or suggestions.
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** On `custom_session_ended`, the lead-followup flow checks this attribute first. If
      non-empty, it retrieves previously scheduled user tasks, analyzes conversation history against these
      instructions, and schedules new tasks through `task_manager_schedule_tasks`. Generated task actions
      support `send_email`, `send_sms`, `make_call`, and `create_meeting`.

      **Fallbacks:** During module initialization, blank values are normalized to whitespace. At runtime,
      blank/whitespace content is treated as disabled, and follow-up scheduling exits early.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_time_zone`: Used as timezone fallback when user timezone is unavailable for
          calculating action scheduling time.
      - **Logic Interactions:**
        - `custom_session_ended`: Entry event that triggers lead-nurturing follow-up resolution.
        - `task_manager_get_user_tasks`: Provides existing tasks to avoid duplicate scheduling.
        - `task_manager_schedule_tasks`: Receives resolved follow-up tasks for execution.
    group: Module - Lead Nurturing
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_business_top_location_count
    value: " "
    title: Number of Business Locations [A]
    description: |-
      Store the total number of locations in your business network. This is primarily informational
      metadata for configuration and reporting.

      **Pro-Tip:** Keep this value aligned with your location list so team members can quickly verify
      multi-location setup consistency.

      **Examples:**

      - **`1`:** Single-location operation.
      - **`2` or more:** Multi-location operation.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Stored as informational metadata for operational reference. In the current
      implementation, it is not used as a direct input for conversation routing or multi-location runtime
      logic.

      **Fallbacks:** If empty, initialization stores a generic placeholder value.

      **Dependencies:**

      - **Primary Settings:**
        - None. This field is maintained manually and is not consumed by runtime routing logic.
      - **Logic Interactions:**
        - `project_attributes_private_feature_flag_multi_location`: Multi-location runtime behavior is
          controlled by this advanced system configuration independently of this count field.
    group: 1. Business - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_attributes_outbound_call_table_csv
    value: ""
    title: Outbound - Call Table CSV [A] [IMPORTANT]
    description: |-
      This attribute stores the CSV source used to create outbound call tasks.

      For new setups, prefer the Widgets-based outbound list workflow. If you
      are moving to that setup, follow
      [this guide](https://help.newo.ai/en/articles/13786164-outbound-calling-via-csv-list).
      This attribute remains available for attribute-driven ingestion.

      **Best Practice:** Keep one lead per row, include a header row, and use international phone format
      with country code for reliable scheduling.

      Preferred columns are:

      - Phone number
      - Reason to call

      Additional columns are allowed. If headers are missing or unconventional, the system still attempts
      to infer phone and call reason from row content.

      Avoid duplicate phone numbers to prevent collisions in call tracking.

      **Examples:**

      ```csv
      Phone Number,Reason to Call
      +1234567890,Needs to be followed up regarding the recent purchase. Product: Laptop. Ask if they are satisfied with the service and if they have any questions
      +1987654321,Check in regarding their account. Updates: Account has been successfully upgraded to premium status.
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** When `task_manager_start_calling` is triggered for `make_call`, TaskManager reads
      this CSV, normalizes line breaks, parses quoted cells/newlines, optionally detects header row, and
      schedules tasks in batches of up to 50 rows. For recognized `phone` + `reason` headers, rows are
      scheduled directly from those columns. For other formats, runtime attempts per-row contact
      extraction; rows where phone extraction fails are recorded as failed outbound records instead of
      being scheduled.

      **Fallbacks:** During module initialization, empty values are normalized to an empty string. If this
      attribute is non-empty during outbound project import/publish, the system auto-triggers call
      scheduling. After parsing, the source CSV is cleared to avoid accidental reprocessing.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_outbound_call_table_csv_result`: Root result attribute for outbound CSV
          reporting compatibility.
      - **Logic Interactions:**
        - `task_manager_start_calling`: Entry event that consumes this CSV source.
        - `start_tasks_batch`: Internal batching event used to process rows in chunks.
        - `update_call_record`: Captures rows that cannot be converted into callable tasks.
    group: Module - Outbound
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_outbound_call_table_csv_result
    value: ""
    title: Outbound - Calling Result CSV [A]
    description: |-
      This attribute is the root result entry for outbound CSV processing.

      Use it as the starting point for result discovery in Attributes. Runtime stores actual rows in
      generated batch result attributes.

      **Best Practice:** Export batch values as `.csv` files for analysis, especially when processing
      larger lists.

      Example batch CSV structure:

      ```csv
      Cell Phone,End Call Reason,Status,Summary,Call Recording / Transcript
      1234567890,customer-answered,completed,"task id: ...",https://...
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** `update_call_record` creates or updates dynamic attributes named
      `project_attributes_outbound_call_table_csv_result_batch_<n>`. Each batch stores up to 50 data rows
      plus header. Existing phone rows are replaced with newer status data; otherwise new rows are
      appended to the first batch with available capacity.

      **Fallbacks:** Module initialization ensures this root attribute exists as an empty string for
      compatibility. If no outbound records were written yet, batch attributes may be absent.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_outbound_call_table_csv`: Optional call-CSV source path that can feed this
          result pipeline.
      - **Logic Interactions:**
        - `task_manager_start_calling`: Accepts outbound CSV payloads (call or SMS) that flow into result
          updates.
        - `update_call_record`: Writes and updates batch CSV attributes and their metadata titles.
        - `update_outbound_record`: Sends parallel outbound record updates to webhook/API integration.
    group: Module - Outbound
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_setting_outbound_naive_conversation_deadline_seconds
    value: "180"
    title: Outbound - Conversation Start Deadline (Queue Timeout) [C]
    description: |-
      This advanced setting defines how many seconds the system waits for a call to actually start after
      an outbound call attempt is launched.

      If the conversation does not start in time, the deadline timer closes the attempt with a deadline
      reason and the dispatcher moves into outbound completion analysis.

      **Best Practice:** Set this high enough to tolerate provider setup latency, but low enough to avoid
      holding capacity slots for stalled attempts.

      Behavior:

      - **Within deadline:** When call start is confirmed, the deadline timer is canceled and normal call
        flow continues.
      - **Deadline exceeded:** The dispatcher closes the active attempt, frees the outbound slot, and
        starts the conversation-retrieval/analyzing path for follow-up handling.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Outbound call launch sets a `call_deadline_exceeded` timer on `outbound_timer`
      using this value. The `conversation_started` event disables that timer. `make_call` startup error
      handling also disables the same timer so a failed startup cannot later produce a stale deadline
      failure for the task. If the timer fires, runtime emits `outbound_call_finished` with deadline
      reason, increments attempt count, removes the active call from tracking, starts queued-call release
      logic, and requests conversation retrieval while the task moves to `analyzing`.

      **Fallbacks:** If empty, initialization seeds `180`, and call launch logic also guards with default
      `180`.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_outbound_max_active_calls`: Capacity slot pressure and queue release
          behavior are affected by how long attempts wait before deadline failure.
      - **Logic Interactions:**
        - `call_deadline_exceeded`: Timer event fired when the start deadline is exceeded.
        - `conversation_started`: Cancels the deadline timer.
        - `outbound_call_finished`: Consolidates deadline failures into shared outbound completion logic.
        - `project_attributes_setting_outbound_default_retry_number`: Can affect later retry handling if
          conversation retrieval returns empty after deadline completion.
    group: Module - Outbound
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_attributes_setting_outbound_default_retry_timeout
    value: "10"
    title: Outbound - Default Retry Timeout [A]
    description: |-
      This setting defines how many minutes the system waits before starting the next outbound retry.

      Use it to control retry pacing between failed attempts.

      **Best Practice:** Use a timeout long enough to avoid immediate redial pressure but short enough to
      keep follow-up timely.

      Behavior:

      - **Lower values:** Retries are scheduled sooner after a failed attempt.
      - **Higher values:** Retries are spaced farther apart.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** When retry is allowed, the system schedules a timer for `outbound_retry_calling`
      using this value (minutes) plus a small scheduling buffer. On timer fire, the retry path fetches the
      task again and attempts to relaunch the call flow. This includes retriable `make_call` startup
      errors, such as busy responses and voice-provider call-limit responses.

      **Fallbacks:** If empty during module initialization, this attribute defaults to `10`.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_outbound_default_retry_number`: Controls whether another retry is
          allowed before this timeout is applied.
      - **Logic Interactions:**
        - `outbound_retry_calling`: Timer event that triggers the retry attempt.
        - `task_manager_get_task`: Retrieves task payload prior to retry execution.
    group: Module - Outbound
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_attributes_setting_outbound_greeting_delay
    value: "0"
    title: Outbound - Greeting Delay [A]
    description: |-
      This setting stores the intended delay (in seconds) before an outbound greeting is played.

      Use it when your outbound runtime is configured to support delayed greeting behavior.

      **Best Practice:** Keep this at `0` unless you have a specific operational reason to delay greeting
      playback.

      Behavior:

      - **`0`:** No delay intent is configured.
      - **`> 0`:** A delayed-greeting intent is configured for runtimes that consume this setting.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Module import normalizes and stores this value, but current outbound call/SMS
      dispatch paths do not read it when issuing delivery commands.

      **Fallbacks:** If empty during module initialization, this attribute defaults to `0`.

      **Dependencies:**

      - **Logic Interactions:**
        - `project_publish_finish`: Triggers module initialization flow that seeds this attribute when
          empty.
    group: Module - Outbound
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_attributes_setting_outbound_max_active_calls
    value: "50"
    title: Outbound - Max Active Calls [C]
    description: |-
      This advanced setting defines the maximum number of outbound calls that can run at the same time.

      It protects throughput stability by limiting concurrent call load and avoiding connector
      oversubscription.

      **Best Practice:** Align this value with your voice provider capacity, account limits, and
      acceptable queue latency.

      Behavior:

      - **Below limit:** New tasks launch immediately.
      - **At limit:** New tasks are queued and started automatically when active slots are freed.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Before starting a call, runtime checks active call count and compares it with this
      limit. Active calls are tracked in AKB entries labeled `active_call`; queued tasks are stored in an
      AKB queue record (`queued_calls`). Active-call records are kept idempotent by task ID, and queue
      records are de-duplicated by task ID. On call completion/failure cleanup, the system attempts to
      start the next queued task if capacity is available. If the voice provider rejects a launched
      `make_call` because a call limit was reached, runtime releases the active-call record and moves the
      task into retry handling instead of leaving it in active-call tracking.

      **Fallbacks:** If empty, initialization seeds `50`, and runtime guards also use default `50` in
      capacity checks.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_outbound_naive_conversation_deadline_seconds`: Influences how long a
          call may hold a concurrency slot before deadline-based failure handling releases capacity.
      - **Logic Interactions:**
        - `task_manager_dispatch_task`: Internal worker handoff where capacity is checked before launch.
        - `outbound_call_finished`: Completion path that releases active-call tracking and triggers queued
          call startup.
    group: Module - Outbound
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_attributes_setting_outbound_default_retry_number
    value: "3"
    title: Outbound - Number Of Attempts [A]
    description: |-
      This setting defines the maximum number of outbound call attempts per task.

      Use it to control how many total call attempts the system can make before it stops retrying that
      task.

      **Best Practice:** Tune this together with retry timeout to balance contact rate and operational
      cost.

      Behavior:

      - **Attempts below limit:** The task is rescheduled for another attempt.
      - **Attempts at/above limit:** Retries stop, the task is finished, and no-answer handling runs.

      Retry logic is applied in the proven failed/no-answer branches, such as unanswered calls, busy
      results, voicemail detection, selected connection failures, voice-provider call-limit errors, and
      empty conversation retrieval results.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Retry evaluation compares current `attemptNumber` against this value in outbound
      retry handling. Failed `make_call` startup responses that should be retried increment the attempt
      counter before entering this evaluation. When retries are still allowed, the system schedules
      `outbound_retry_calling` via session timer. When the limit is reached, task status is set to `done`
      and the no-answer completion flow is executed.

      **Fallbacks:** If empty during module initialization, this attribute defaults to `3`.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_outbound_default_retry_timeout`: Defines delay between retry
          attempts.
      - **Logic Interactions:**
        - `outbound_retry_calling`: Timer event used to trigger retry execution.
        - `task_manager_get_task`: Fetches task payload again before retrying.
    group: Module - Outbound
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_attributes_setting_outbound_payload_schema
    value: "{}"
    title: Outbound - Payload Schema [C]
    description: |-
      This advanced setting defines a JSON schema for extra fields that should be extracted from outbound
      conversation content before sending result payloads.

      Use it to enrich outbound callbacks with structured data (for example intent tags or custom business
      fields) derived from call/SMS conversation text.

      **Best Practice:** Keep this as a valid JSON schema object with explicit field descriptions and
      types. Fields that cannot be reliably extracted are returned as `null`.

      **Examples:**

      ```json
      {
        "type": "object",
        "properties": {
          "lead_interest": {
            "type": "string",
            "description": "Short summary of user interest level."
          },
          "follow_up_priority": {
            "type": "string",
            "description": "Priority label: high, medium, or low."
          }
        }
      }
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** After outbound conversation analysis, runtime builds a base payload and, when this
      schema is non-empty, runs structured extraction against conversation transcript/memory. Extracted
      fields are merged into the outgoing payload before endpoint dispatch.

      **Fallbacks:** If empty during initialization, this attribute is seeded with `{}`. Blank or `{}` at
      runtime disables schema-based enrichment and sends only the base payload fields.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_outbound_request_endpoint`: Controls whether enriched payloads are
          actually delivered externally.
        - `project_attributes_setting_outbound_request_headers`: Applied as HTTP headers when dispatching
          enriched payloads.
      - **Logic Interactions:**
        - `convoagent_conversation_retrieved`: Call conversation analysis path that can apply this schema.
        - `custom_session_ended`: SMS analysis path that can apply this schema.
    group: Module - Outbound
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.json"
  - idn: project_attributes_setting_outbound_request_endpoint
    value: ""
    title: Outbound - Request Endpoint [C]
    description: |-
      This advanced setting defines the HTTP endpoint URL that receives outbound result payloads.

      When configured, payload delivery is attempted for outbound call and outbound SMS result flows.

      **Best Practice:** Use a stable HTTPS endpoint with request logging and idempotent processing.

      Behavior:

      - **Endpoint is set:** The system posts outbound result payloads (finished/failed/error paths) to
        this URL.
      - **Endpoint is empty:** External POST requests are skipped; internal task updates and result
        recording continue.

      **Examples:**

      ```txt
      https://api.example.com/outbound/callback
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Before dispatch, runtime enriches payload with core identifiers (`phone_number`,
      `user_id`, `task_id`) and merges optional callback arguments from task context. It then sends a POST
      request via `http_connector` using `project_attributes_setting_outbound_request_headers`.

      **Fallbacks:** If empty during initialization, this attribute is set to an empty string. At runtime,
      empty value short-circuits webhook sending logic.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_outbound_request_headers`: Header JSON used for outbound HTTP POST.
        - `project_attributes_setting_outbound_payload_schema`: Optional enrichment schema for payload
          content before dispatch.
      - **Logic Interactions:**
        - `convoagent_conversation_retrieved`: Call-analysis route that can trigger endpoint dispatch.
        - `custom_session_ended`: SMS-analysis route that can trigger endpoint dispatch.
        - `result_error`: Call error route that can trigger endpoint dispatch.
        - `server_message_error`: Additional call error route that can trigger endpoint dispatch through
          shared no-answer handling.
        - `send_sms_error`: SMS error route that can trigger endpoint dispatch.
    group: Module - Outbound
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_setting_outbound_request_headers
    value: ""
    title: Outbound - Request Headers [C]
    description: |-
      This advanced setting defines HTTP headers used when outbound result payloads are posted to your
      external endpoint.

      Use it to pass authentication and integration metadata (for example API keys, bearer tokens, or
      tenant headers).

      **Best Practice:** Provide a valid JSON object of headers and keep credential values rotated through
      your standard secret-management process.

      **Examples:**

      ```json
      {
        "Authorization": "Bearer <token>",
        "Content-Type": "application/json",
        "X-Tenant-Id": "acme"
      }
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** When outbound webhook dispatch is active, these headers are passed directly to the
      HTTP `send_request` command used for call and SMS result payload delivery.

      **Fallbacks:** During initialization, blank value is normalized to empty string. At runtime, empty
      value is converted to `{}` before request dispatch, so webhook sends continue without custom
      headers.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_outbound_request_endpoint`: Header configuration is applied only
          when endpoint dispatch is enabled.
      - **Logic Interactions:**
        - `convoagent_conversation_retrieved`: Call-analysis route that can dispatch payloads with these
          headers.
        - `custom_session_ended`: SMS-analysis route that can dispatch payloads with these headers.
        - `result_error`: Call error route that can dispatch payloads with these headers.
        - `server_message_error`: Additional call error route that can dispatch payloads with these
          headers through shared no-answer handling.
        - `send_sms_error`: SMS error route that can dispatch payloads with these headers.
    group: Module - Outbound
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.json"
  - idn: project_attributes_setting_outbound_sms_session_duration
    value: "60"
    title: Outbound SMS - Session Duration [C]
    description: |-
      This advanced setting defines how many minutes an outbound SMS session stays open while waiting for
      the user to respond.

      Use it to control how long the system waits before concluding the SMS interaction window.

      **Best Practice:** Set a duration that matches your expected response behavior. Longer windows give
      users more time to reply, while shorter windows finalize outcomes faster.

      Behavior:

      - **Longer duration:** Session remains active longer before response analysis is finalized.
      - **Shorter duration:** Session closes sooner and follow-up analysis runs earlier.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** After sending outbound SMS, runtime emits `extend_session` with timeout equal to
      this value converted from minutes to seconds. When the session later ends, SMS outbound analysis
      (`custom_session_ended`) determines finished/failed outcome, updates records, and may dispatch
      external payloads.

      **Fallbacks:** If empty during initialization, this attribute defaults to `60`.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_outbound_request_endpoint`: If configured, SMS analysis results
          after session timeout can be posted externally.
        - `project_attributes_setting_outbound_payload_schema`: Optional schema enrichment applied during
          SMS conversation analysis.
      - **Logic Interactions:**
        - `extend_session`: Receives timeout derived from this setting.
        - `custom_session_ended`: Triggers outbound SMS result analysis after the session window closes.
    group: Module - Outbound
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_attributes_setting_outbound_tasks_working_hours_status
    value: "False"
    title: Outbound Tasks - Working Hours Enforcement - Enabled [C]
    description: |-
      This setting controls whether outbound call and outbound SMS tasks may be handed off only during
      business working hours.

      **Best Practice:** Enable this if your team wants TaskManager to delay outbound contact attempts
      until the next open business window instead of dispatching them immediately.

      Behavior by value:

      - **Enabled (`True`):** TaskManager checks the effective execution moment for outbound `make_call`
        and `send_sms` tasks. If `asap`, `execute_in`, or `execute_at` resolve outside business hours, it
        rewrites the task to the next available working-hours slot before sending it to workers.
      - **Disabled (`False`):** TaskManager keeps existing outbound timing unchanged, even if the task is
        scheduled outside business hours.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** This flag is evaluated in TaskManager when `external_request`,
      `task_manager_schedule_tasks`, or a prebuilt `task_manager_execute_task` request is received for
      outbound task types. Runtime first resolves the base execution moment from `execute_in`,
      `execute_at`, or immediate `asap` delivery. If this setting is enabled and the resulting outbound
      execution moment falls outside business hours, TaskManager replaces it with the next future open
      slot derived from the business schedule and then schedules the worker handoff for that rewritten
      time.

      The gate applies before TaskManager emits the internal `task_manager_dispatch_task` worker handoff.
      After a task is handed off, worker-side queues, retries, and follow-up timers continue with their
      own logic and are not re-checked by this setting.

      **Fallbacks:** Initialized to `False` during common setup. If business time zone or structured
      working-hours data is unavailable at runtime, TaskManager leaves outbound timing unchanged.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_working_hours`: Source schedule used to determine whether outbound execution
          falls inside or outside business hours.
        - `project_business_time_zone`: Time-zone basis used to evaluate the current time, `execute_at`,
          and derived future execution moments against the business schedule.
      - **Logic Interactions:**
        - Applies only to outbound `make_call` and `send_sms` tasks; non-outbound tasks keep their normal
          execution timing.
        - When enabled, `execute_in` can be converted into a later `execute_at` if the calculated target
          lands outside business hours.
        - When enabled, `execute_at` is preserved if it already lands inside business hours and rewritten
          only when it falls outside the allowed schedule.
    group: 4. Agent Behavior - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.bool"
  - idn: project_business_top_url
