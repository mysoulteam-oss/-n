    description: |-
      Stores the current SuperAgent build/version label for your workspace. It helps support and analytics
      systems identify which NAF version produced session data.

      **Pro-Tip:** Treat this as a system-managed value. Do not edit it manually unless requested by the
      technical team during controlled troubleshooting.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Set by metadata versioning flow and included in end-session outputs. It is sent in
