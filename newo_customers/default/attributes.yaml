      # **Frequently asked questions (FAQ)**
      Q: Які послуги надає ваша компанія?
      A: ГК «Нафтогаз України» забезпечує газом понад 12,5 млн українських домогосподарств та поставляє блакитне паливо більш ніж 4,9 тис. представникам середнього і малого бізнесу. Компанія також є ліцензованим постачальником електричної енергії для непобутових споживачів.
      Q: Як я можу дізнатися номер свого особового рахунку?
      A: Ви можете дізнатися номер свого особового рахунку, перейшовши за посиланням у чат-бот GASUA в Telegram або Viber.
      Q: Які переваги особистого кабінету?
      A: В особистому кабінеті ви можете швидко передавати показання лічильника, сплачувати за газ онлайн, переглядати історію платежів, отримувати довідки та акти, відстежувати обсяг споживання та отримувати важливі нагадування.
      Q: Як зареєструватися в особистому кабінеті?
      A: Щоб зареєструватися, перейдіть на сторінку my.gas.ua/register. Якщо у вас вже є кабінет, ви можете увійти за адресою my.gas.ua/login.
      Q: Чи можу я керувати кількома рахунками?
      A: Так, в особистому кабінеті можна вносити дані та керувати декількома рахунками, які ви маєте в нашій компанії.
      Q: Яка місія вашої компанії?
      A: Місія компанії — забезпечити людей національними енергетичними ресурсами та кращими енергоощадними рішеннями.
      Q: Які цінності вашої компанії?
      A: Наші цінності — це відкритість, безпека, ефективність та турбота про споживача. Ми працюємо прозоро й на результат, піклуючись про наших клієнтів.
      Q: Чи продає компанія якесь обладнання?
