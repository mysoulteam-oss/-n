  - idn: project_attributes_faq
    value: |-
      Q: Які послуги надає ваша компанія?
      A: ГК «Нафтогаз України» забезпечує газом понад 12,5 млн українських домогосподарств та поставляє блакитне паливо більш ніж 4,9 тис. представникам середнього і малого бізнесу. Компанія також є ліцензованим постачальником електричної енергії для непобутових споживачів.
      Q: Як я можу дізнатися номер свого особового рахунку?
      A: Ви можете дізнатися номер свого особового рахунку, перейшовши за посиланням у чат-бот GASUA в Telegram або Viber.
      Q: Які переваги особистого кабінету?
      A: В особистому кабінеті ви можете швидко передавати показання лічильника, сплачувати за газ онлайн, переглядати історію платежів, отримувати довідки та акти, відстежувати обсяг споживання та отримувати важливі нагадування.
      Q: Як зареєструватися в особистому кабінеті?
      A: Щоб зареєструватися, перейдіть на сторінку my.gas.ua/register. Якщо у вас вже є кабінет, ви можете увійти за адресою my.gas.ua/login.
      Q: Чи можу я керувати кількома рахунками?
      A: Так, в особистому кабінеті можна вносити дані та керувати декількома рахунками, які ви маєте в нашій компанії.
      Q: Яка місія вашої компанії?
      A: Місія компанії — забезпечити людей національними енергетичними ресурсами та кращими енергоощадними рішеннями.
      Q: Які цінності вашої компанії?
      A: Наші цінності — це відкритість, безпека, ефективність та турбота про споживача. Ми працюємо прозоро й на результат, піклуючись про наших клієнтів.
      Q: Чи продає компанія якесь обладнання?
      A: Так, у нас є онлайн-простір tech.gas.ua, де можна знайти енергоефективні рішення для оселі – від газової колонки до альтернативних джерел енергії, таких як генератори.
      Q: Які товари можна знайти у вашому інтернет-магазині?
      A: У нашому магазині tech.gas.ua ви можете придбати генератори, автомобільні акумулятори та іншу техніку та прилади.
      Q: Для кого компанія постачає електричну енергію?
      A: ГК «Нафтогаз України» є ліцензованим постачальником електричної енергії для непобутових (юридичних) споживачів по всій території України.
    title: 3-04. FAQ [A]
    description: |-
      Use this field for common customer questions and your preferred answers. It gives the Agent
      ready-to-use responses for recurring requests.

      **Best Practice:** Write each item as a direct question with a concise answer. Include escalation
      language when human follow-up is required.

      **Examples:**

      ```txt
      1. Can I reschedule my appointment?
      > Yes. Please share your preferred new date/time and we will confirm availability.

      2. Do you accept same-day bookings?
      > We can sometimes accommodate same-day requests depending on open slots.

      3. I need to file a complaint.
      > I am sorry you had this experience. I can collect details and notify a manager immediately.
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Included in industry business-context prompts so the Agent can answer high-volume
      questions with consistent phrasing.

      **Fallbacks:** On first initialization, this can be copied from Agent Creator intake. If it remains
      empty, FAQ-specific guidance is simply omitted from context.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_industry`: Determines which industry business-context template consumes this
          FAQ block.
      - **Logic Interactions:**
        - `project_attributes_terms_and_conditions`: Often used together to separate FAQ responses from
          formal policy/rules content.
    group: 3. Knowledge Base
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_terms_and_conditions
    value: "- **Cancellation policy**: null"
    title: 3-05. Additional Details and Rules [B]
    description: |-
      Use this field for operational rules customers should know before booking or visiting (policies,
      access rules, timing, and constraints).

      **Pro-Tip:** Keep each rule short and unambiguous. Focus on policies that change customer decisions
      or prevent scheduling friction.

      **Examples:**

      ```txt
      - Cancellation policy: 24-hour notice required to avoid fees.
      - Late arrival policy: Reservations are held for 15 minutes.
      - Pet policy: Service animals only.
      - Accessibility: Wheelchair-accessible entrance and seating available.
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Added to business-context instructions (industry-dependent) and used as policy
      ground truth for customer-facing answers.

      **Fallbacks:** During initialization, the system may prefill this from Agent Creator intake and/or
      industry starter templates. If still empty, policy guidance is omitted until values are provided.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_industry`: Controls which industry templates seed and consume this field.
      - **Logic Interactions:**
        - `project_attributes_faq`: Use FAQ for conversational Q&A and this field for strict policy/rules
          so handoffs stay consistent.
    group: 3. Knowledge Base
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_rag_knowledge_base_append_text
    value: " "
    title: 3-06-A. RAG - Knowledge Base - Text [A]
    description: |-
      Use this field to append text-based knowledge to the Agent without replacing existing memory. It is
      best for manuals, policies, scripts, and long-form reference content.

      **Best Practice:** Add content in focused batches by topic, then wait for this field to clear before
      submitting the next batch. For large payloads, keep each batch reasonably sized (about 100,000
      characters or less) to reduce processing failures.

      **Examples:**

      ```txt
      # Refund Policy
      Customers may request a refund within 30 days of purchase with proof of payment.

      # Installation Timeline
      Standard installations are completed within 5-7 business days after confirmation.
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** When the knowledge-base append processing cycle runs and this field contains new
      non-empty content, the system converts the text into structured AKB-ready topics, creates new AKB
      records labeled `rag_autogenerated_from_text`, writes an audit entry to the text log, and clears
      this input field.

      **Retrieval Behavior:** Text-appended topics are evaluated alongside website-appended topics by
      relevance to the conversation. New text append requests create additional topics; to fully replace
      older text-appended content, use the text reset setting before appending.

      **Fallbacks:** Initialized as empty/whitespace. Empty input is ignored. If reset is requested, all
      text-appended AKB topics are deleted and the reset switch auto-returns to `False`.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_rag_knowledge_base_append_text_log`: Receives append history entries for
          each successful request.
        - `project_attributes_rag_knowledge_base_append_text_reset`: Clears existing text-appended memory
          before new content is applied.
      - **Logic Interactions:**
        - `project_attributes_rag_knowledge_base_append_websites`: Website append flow is independent and
          can run in parallel with text append memory.
        - `project_attributes_rag_knowledge_base_append_websites_reset`: Resets only website-appended
          memory and does not clear text-appended memory.
        - `project_business_industry`: Added as AKB label context for appended topics.
        - `project_attributes_scenario`: Added as AKB label context for appended topics.
    group: 3. Knowledge Base
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_rag_knowledge_base_append_text_log
    value: " "
    title: 3-06-B. RAG - Knowledge Base - Text - Log [A]
    description: |-
      This is the running history of text batches you appended to memory. It acts as an audit trail and
      easy recovery source.

      **Best Practice:** Keep this log intact for traceability. If memory is reset, copy needed sections
      from here back into the text append field.

      **Note:** System logic appends entries automatically. You can still edit this field manually for
      corrections.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Each successful text append writes a timestamped log block using the standard
      separator/header format, with newest entries appended at the end.

      **Fallbacks:** Initialized as empty/whitespace. If project timezone is missing, timestamps are
      generated using UTC.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_rag_knowledge_base_append_text`: Source input whose successful appends are
          recorded here.
        - `project_business_time_zone`: Used to render human-readable log timestamps.
      - **Logic Interactions:**
        - `project_attributes_rag_knowledge_base_append_text_reset`: Log remains available for recovery
          after text-memory resets.
        - `project_attributes_rag_knowledge_base_append_websites_log`: Uses the same append-log format and
          rolling cleanup strategy.

      **Capacity Notes:** The log uses a rolling window of approximately 180,000 characters. When the
      limit is reached, oldest full entries are dropped first.
    group: 3. Knowledge Base
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_rag_knowledge_base_append_text_reset
    value: "False"
    title: 3-06-C. RAG - Knowledge Base - Text - Reset [A]
    description: |-
      This switch clears text-appended memory so you can repopulate it cleanly.

      **Best Practice:** Turn this on before replacing large or outdated text batches to avoid old and new
      versions coexisting.

      Behavior:

      - **Enabled (`True`):** Deletes all AKB topics labeled `rag_autogenerated_from_text`, clears
        text-append staging, then auto-sets itself back to `False`.
      - **Disabled (`False`):** No reset is performed.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Evaluated early in the text append pipeline. Reset is executed before processing
      new text input in the same cycle.

      **Fallbacks:** Default state is `False`. If set to `True`, auto-reset to `False` happens after reset
      completion.

      **Warning:** Reset removes active text-appended AKB memory and cannot be undone from runtime state.
      Use the text log as your recovery source.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_rag_knowledge_base_append_text`: If new text is present, it is processed
          after reset completes.
        - `project_attributes_rag_knowledge_base_append_text_log`: Reset does not remove append history.
      - **Logic Interactions:**
        - `project_attributes_rag_knowledge_base_append_websites_reset`: Independent reset path for
          website-appended memory.
    group: 3. Knowledge Base
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.bool"
  - idn: project_attributes_rag_knowledge_base_append_websites
    value: " "
    title: 3-06-D. RAG - Knowledge Base - Websites [A]
    description: |-
      Use this field to append knowledge from websites by providing URLs plus extraction instructions.
      This is useful for live menus, policy pages, product pages, and other web-hosted content.

      **Best Practice:** Point to specific pages (not broad homepages), include your objective, and submit
      only the sources relevant to what the Agent should learn next.

      **Examples:**

      ```txt
      Website: https://example.com
      Objective: Collect information about pricing and services offered
      Keywords: pricing, services

      Website: https://another-example.com
      Objective: Gather details on customer testimonials and reviews
      Keywords: testimonials, reviews
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** When the append processing cycle detects new website instructions in this field,
      the system sends an asynchronous website search/scrape request. The scraper returns successful
      content in chunk callbacks and sends a finalization callback after all search/extract requests are
      finished. At finalization, scraped text is transformed into structured AKB-ready topics, new AKB
      records are created with label `rag_autogenerated_from_websites`, the request is logged, and this
      field is cleared.

      If the website search/extraction service reports a failure, that failed callback is not converted
      into AKB topics. The failed attempt is written to the website append log with the failed website
      item. After a failed callback is logged, this field is cleared so the request does not continue to
      appear pending.

      **Retrieval Behavior:** Website-appended topics are evaluated alongside text-appended topics by
      relevance. New website append requests create additional topics; to fully replace older
      website-appended content, use the website reset setting before re-appending.

      **Fallbacks:** Initialized as empty/whitespace. Empty input is ignored. Because processing is
      asynchronous, completion time depends on scraping volume and external response timing.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_rag_knowledge_base_append_websites_log`: Stores the original website
          requests/instructions after successful processing.
        - `project_attributes_rag_knowledge_base_append_websites_reset`: Clears existing website-appended
          AKB memory before re-appending updated sources.
      - **Logic Interactions:**
        - `project_attributes_rag_knowledge_base_append_text`: Text append flow is independent and can be
          used alongside website append memory.
        - `project_attributes_rag_knowledge_base_append_text_reset`: Resets only text-appended memory.
        - `project_business_industry`: Added as AKB label context for appended topics.
        - `project_attributes_scenario`: Added as AKB label context for appended topics.
    group: 3. Knowledge Base
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_rag_knowledge_base_append_websites_log
    value: " "
    title: 3-06-E. RAG - Knowledge Base - Websites - Log [A]
    description: |-
      This is the history of website append requests you submitted (URLs and objectives). It helps you
      track what was requested and replay it when needed.

      **Best Practice:** Treat this as your replay list. After a reset, copy selected entries back into
      the website append field to rebuild web-based memory quickly.

      **Note:** System logic appends entries automatically. You can edit this field manually for
      corrections when needed.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Writes one timestamped log block per website append attempt. Successful entries
      store your request text/instructions, not the scraped page content itself. Failed entries include
      the failed status, error message, and the original failed website item when available (`Website`,
      `Objective`, and `Keywords`). Technical extract URLs are used only as a fallback for older in-flight
      requests that do not carry item context.

      **Fallbacks:** Initialized as empty/whitespace. If project timezone is missing, timestamps are
      generated using UTC.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_rag_knowledge_base_append_websites`: Source requests that are logged here
          after successful append completion.
        - `project_business_time_zone`: Used for timestamp generation in log headers.
      - **Logic Interactions:**
        - `project_attributes_rag_knowledge_base_append_websites_reset`: Log remains available for replay
          even after website memory resets.
        - `project_attributes_rag_knowledge_base_append_text_log`: Shares the same append-log delimiter
          format and rolling cleanup strategy.

      **Capacity Notes:** The log uses a rolling window of approximately 180,000 characters. Oldest full
      entries are removed first when space is needed.
    group: 3. Knowledge Base
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_rag_knowledge_base_append_websites_reset
    value: "False"
    title: 3-06-F. RAG - Knowledge Base - Websites - Reset [A]
    description: |-
      This switch clears website-appended memory so you can re-import refreshed web content.

      **Best Practice:** Enable reset before re-crawling heavily changed websites to prevent stale and
      updated versions from mixing.

      Behavior:

      - **Enabled (`True`):** Deletes AKB topics labeled `rag_autogenerated_from_websites`, clears
        website-append staging, and auto-sets itself back to `False`.
      - **Disabled (`False`):** No reset is performed.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Evaluated at the start of the website append pipeline. Reset executes before any
      new website append request in the same run.

      **Fallbacks:** Default state is `False`. If set to `True`, auto-reset to `False` occurs after reset
      completion.

      **Warning:** Reset removes active website-appended AKB memory and cannot be undone from runtime
      state. Use the website log as your replay source.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_rag_knowledge_base_append_websites`: If new website instructions are present
          after reset, they are processed as a fresh append request.
        - `project_attributes_rag_knowledge_base_append_websites_log`: Reset does not erase request
          history.
      - **Logic Interactions:**
        - `project_attributes_rag_knowledge_base_append_text_reset`: Independent reset path for
          text-appended memory.
    group: 3. Knowledge Base
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.bool"
  - idn: project_attributes_setting_calendar_event_integration
    value: google_integration
    title: 4-04. Appointment - Calendar Event Integration [A] [IMPORTANT]
    description: |-
      Choose how the Agent should handle calendar event creation during appointment flows.

      **Best Practice:** Enable only the integration your team actually uses in production and keep
      related setup fields complete before going live.

      Behavior by value:

      - **`disabled`:** The Agent does not attempt calendar-event creation.
      - **`calcom_integration`:** Appointment flow follows Cal.com integration logic.
      - **`google_integration`:** The Agent can create calendar invites directly.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** This setting controls which appointment-creation path is exposed in runtime
      prompts. For Google integration, the system builds meeting payloads and includes both the user email
      and `project_business_manager_email` as attendees. It also controls `create_meeting_tool`
      registration and the meeting-action state visibility in runtime context. For Cal.com integration,
      the appointment scenario follows booking-style availability and booking-submission steps instead of
      the Google meeting-creation path.

      **Fallbacks:** During initialization, this value can be taken from Agent Creator settings; many
      industry defaults keep it disabled. If not configured to an active integration, event creation paths
      stay inactive.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_manager_email`: Used as a required attendee in Google invite creation.
        - `project_attributes_setting_booking_enabled`: Required for Cal.com integration flows that rely
          on booking-style tool registration and booking action-state handling.
      - **Logic Interactions:**
        - `project_attributes_setting_meeting_duration`: Used for Google meeting creation payload.
        - `project_attributes_setting_meeting_setup_phrase`: Alters accepted phrasing for
          `create_meeting_tool` triggering when Google integration is active.
        - `project_attributes_setting_test_mode`: Switches Google meeting handling between live calendar
          command execution and mock success event flow.
    group: 4. Agent Behavior
    is_hidden: false
    possible_values:
      - disabled
      - calcom_integration
      - google_integration
    value_type: !enum "AttributeValueTypes.enum"
  - idn: project_attributes_setting_email_send_information_enabled
    value: "False"
    title: 4-05. Email to User During Session - Enabled [B] [IMPORTANT]
    description: |-
      Turn this on if the Agent is allowed to send emails to users during a live conversation.

      **Pro-Tip:** Enable this only after you configure allowed email content and confirm your team is
      comfortable with what can be sent automatically.

      Behavior by value:

      - **Enabled (`True`):** Email-send tools and email content guidance can be used during the session.
      - **Disabled (`False`):** The Agent will not send user-facing emails during the session. If the user
        asks for email delivery, the Agent should explain that it cannot send the email and that it will
        pass the information to the manager.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** This flag gates email-related prompt instructions and tool availability. It is
      also used by send-message routing logic when deciding delivery channels. In voice prompts, the
      disabled state adds an explicit fallback instruction to tell the user email cannot be sent and the
      information will be passed to the manager instead.

      **Fallbacks:** Common initialization keeps this field empty until industry defaults apply; industry
      content setup then typically sets an explicit boolean.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_email_send_information_allowed_content`: Defines detailed allowed
          email content.
        - `project_attributes_setting_email_send_information_allowed_content_items`: Defines concise
          allowed item list for policy prompts.
      - **Logic Interactions:**
        - `project_attributes_setting_sms_send_information_enabled`: Channel routing may prefer SMS first
          when both channels are available.
    group: 4. Agent Behavior
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.bool"
  - idn: project_attributes_setting_email_send_information_allowed_content
    value: |-
      - Payment link for product/service item according to the **Products and Services** block: '[product/service item name] link: [product/service link]'
      - Link to make an appointment: 'Please use this link to make an appointment: [appointment_url]'
      - Business Details link if agent mentions sending content that is not listed: 'Please use this link for more information: [website_url]'
    title: 4-06. Email to User During Session - Allowed Content [B] [IMPORTANT]
    description: |-
      Define the exact email content templates or rules the Agent is allowed to send.

      **Best Practice:** Keep this content explicit and reusable (clear subject/body format, approved
      placeholders, and approved tone).

      **Examples:**

      ```txt
      # Appointment Confirmation

      Email subject:
      ---
      [business_name] - Appointment Confirmation
      ---

      Email body:
      ---
      Dear [user_name],<br><br>

      Thank you for choosing [business_name]!<br><br>

      <strong>Appointment Summary:</strong><br>
      Appointment date: [preferred_date]<br>
      Appointment time: [preferred_time]<br>

      One of our team members will review your appointment request and confirm the details shortly.<br><br>

      Warm regards,<br>
      [[agent_name]]
      ---
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Runtime email-send flows inject this field as the primary policy/context block
      that constrains what the Agent may send.

      **Fallbacks:** Common defaults initialize this as empty and industry-specific preparation fills it.
      If this remains empty while email sending is enabled, policy guidance becomes under-specified.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_email_send_information_enabled`: Must be enabled for this content to
          be actionable.
        - `project_attributes_setting_email_send_information_allowed_content_items`: Companion concise
          list used by separate prompt constraints.
      - **Logic Interactions:**
        - `project_business_name`: Commonly used placeholder in approved templates.
    group: 4. Agent Behavior
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_setting_email_send_information_allowed_content_items
    value: |-
      - Payment link for product/service item according to the **Products and Services** block
      - Link to make an appointment
      - Business Details link if agent mentions sending content that is not listed
    title: 4-07. Email to User During Session - Allowed Content Items [B] [IMPORTANT]
    description: |-
      Define a short, high-level whitelist of what the Agent may include in emails.

      **Pro-Tip:** Use this field for concise policy items (what is allowed), and keep full writing
      templates in the Allowed Content field.

      **Examples:**

      ```txt
      - Appointment confirmation summary
      - Booking or purchase links
      - Next-step instructions
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** This field is injected into runtime explicit-constraint prompts as a compact
      allow-list for email content decisions.

      **Fallbacks:** Defaults initialize this as empty and industry initialization usually provides a
      value. If empty with email enabled, constraint quality degrades.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_email_send_information_enabled`: Activates/deactivates email policy
          usage.
        - `project_attributes_setting_email_send_information_allowed_content`: Full content policy that
          complements this condensed list.
      - **Logic Interactions:**
        - `project_attributes_setting_sms_send_information_allowed_content_items`: Teams often align both
          channel lists to keep policy consistency.
    group: 4. Agent Behavior
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_setting_sms_send_information_enabled
    value: "True"
    title: 4-08. SMS to User During Session - Enabled [B] [IMPORTANT]
    description: |-
      Turn this on if the Agent is allowed to send SMS/text messages during the conversation.

      **Best Practice:** Enable only after you define approved SMS content and confirm operational rules
      for messaging customers.

      Behavior by value:

      - **Enabled (`True`):** SMS send tools and SMS content guidance are available.
      - **Disabled (`False`):** SMS information-send tools and SMS policy guidance are disabled. If the
        user asks for SMS delivery, the Agent should explain that it cannot send an SMS and that it will
        pass the information to the manager.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** This flag gates SMS-related prompt constraints and `send_sms_tool` exposure for
      information-delivery behavior. It also affects default channel selection logic when no explicit send
      type is provided. In voice prompts, the disabled state adds an explicit fallback instruction to tell
      the user SMS cannot be sent and the information will be passed to the manager instead. This setting
      does not globally disable every workflow-specific SMS dispatch path.

      **Fallbacks:** Common defaults initialize this field for later industry setup; industry content
      skills usually set a concrete boolean.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_sms_send_information_allowed_content`: Full approved SMS content
          rules.
        - `project_attributes_setting_sms_send_information_allowed_content_items`: Condensed allowed item
          list for policy prompts.
      - **Logic Interactions:**
        - `project_attributes_setting_email_send_information_enabled`: If SMS is off, message routing may
          fall back to email when available.
    group: 4. Agent Behavior
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.bool"
  - idn: project_attributes_setting_sms_send_information_allowed_content
    value: |-
      - Payment link for product/service item according to the **Products and Services** block: '[product/service item name] link: [product/service link]'
      - Link to make an appointment: 'Please use this link to make an appointment: [appointment_url]'
      - Business Details link if agent mentions sending content that is not listed: 'Please use this link for more information: [website_url]'
    title: 4-09. SMS to User During Session - Allowed Content [B] [IMPORTANT]
    description: |-
      Define the exact SMS content the Agent is allowed to send during a session.

      **Pro-Tip:** Keep messages short, operational, and channel-appropriate. Include only approved
      wording for links, confirmations, and next actions.

      **Examples:**

      ```txt
      - Large group reservation acknowledgment and next steps.
      - Link handoff message: "Please use this link to continue: https://example.com/path"
