      - sales_industry
    value_type: !enum "AttributeValueTypes.enum"
  - idn: project_business_language_primary
    value: Ukrainian
    title: 1-16. Language - Primary [B]
    description: |-
      Main default language your Agent should use for customer conversations. This is the baseline
      language when the system has no stronger user-language signal.

      **Pro-Tip:** Set this to the language most customers actually use. If some languages should never be
      used, configure Restricted Languages separately.

      Behavior examples:

      - **Greeting generation:** If no reliable user language is detected yet, greetings use this
        language.
      - **Reports and manager notifications:** Auto-generated report text follows this language.
      - **Live conversation behavior:** This setting remains the default starting point until stronger
        user-language evidence is established later in the conversation.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Used as a core language fallback across ConvoAgent and Outbound flows, including
      greeting generation, user-language defaults, report generation language rules, and outbound greeting
      phrases. It is also used during representative setup to localize language-dependent defaults.

      **Fallbacks:** On initialization, the system first tries to read this from Agent Creator business
      language input. If unavailable, common setup defaults it to `English`. During runtime, it remains
      the default language whenever user-specific language has not been established with stronger
      conversation evidence.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_language_restricted_list`: Restricted-language rules are configured separately
          from this default language.
      - **Logic Interactions:**
        - `project_business_country`: Used together with primary language when generating voice style and
          inferring accent context.
        - `project_representative_agent_voice_disclaimer_phrase`: Default disclaimer text is localized
          using this language during representative attribute preparation.
