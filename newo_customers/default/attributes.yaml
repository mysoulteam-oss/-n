    value_type: !enum "AttributeValueTypes.bool"
  - idn: project_attributes_private_feature_flag_v2v_outbound_include_voicemail_rule_initial_instruction
    value: "False"
    title: |-
      Feature Flag - Voice-to-Voice Outbound - Include Voicemail Rule In Initial Instruction
      [C]
    description: |-
      This advanced system configuration injects the outbound voicemail and call-screening rule directly
      into the initial Voice voice-to-voice prompt.

      **Best Practice:** Enable this only when you want outbound voice-to-voice calls to receive voicemail
      and screening-system handling instructions at the very start of the connector prompt.

      Behavior by value:

      - **Enabled (`True`)**: The initial Voice prompt includes the dedicated voicemail and call-screening
        rule, and outbound spam/voicemail classification narrows its main target label to `spammer`
        because voicemail guidance is already front-loaded into the initial instruction.
      - **Disabled (`False`)**: The initial Voice prompt omits that dedicated voicemail rule, and outbound
        classification keeps the broader `spammer or voicemail` target label.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** The standard feature-flag reader resolves this from
      `project_attributes_private_feature_flag_v2v_outbound_include_voicemail_rule_initial_instruction`,
      and only the exact value `True` is treated as enabled. That injected rule tells the agent how to
      react to voicemail machines, answering machines, call-screening systems, and hold/wait prompts,
      using `project_representative_agent_voicemail_detection_behavior_instruction` for the voicemail
      action text. In outbound spam/voicemail detection, `_defineSpamOrVoiceMailSkill` changes the
      classifier's target wording from `spammer or voicemail` to `spammer` when this flag is enabled,
      which aligns the later detector prompt with the earlier initial-instruction handling.

      **Fallbacks:** Default is `False` during common setup. If connector sync does not run, changing the
      flag alone will not update an already-provisioned connector prompt. Any value other than exact
      `True` is treated as disabled.

      **Dependencies:**

      - **Primary Settings:**
        - `project_representative_agent_voicemail_detection_behavior_instruction`: Supplies the voicemail
          action text embedded into the injected initial instruction.
      - **Logic Interactions:**
        - `project_attributes_setting_check_spam_or_voicemail`: Controls whether spam/voicemail detection
          logic is allowed to run in general, although outbound sessions can still enter that logic under
          the flow's existing outbound rule.
        - `project_attributes_setting_voice_integration_service_voice_mode`: This flag is relevant to the
          voice-to-voice connector prompt path described above.
