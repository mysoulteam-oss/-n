  - idn: project_representative_agent_voice_phone_fallback_area_code
    value: N/A
    title: Voice - AI Phone - Area Code Fallback [C]
    description: |-
      Backup area code used if the primary area code has no available phone numbers.

      **Pro-Tip:** Choose a nearby region your business can still serve naturally.

      **Examples:**

      - **Primary `408`, fallback `650`:** Keep provisioning in the same metro area.
      - **Primary unavailable:** System retries using fallback.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Sent as a fallback parameter in first-time phone purchase requests when the
      primary area-code lookup fails.

      **Fallbacks:** Initialization reads this from `agent_creator_voice_channel_phone.fallback_area_code`
      when available. During phone purchase, Agent Creator phone payload is used directly when present;
      this attribute is used as the fallback area-code source for older accounts. If both sources are
      empty, number purchase runs without a fallback area-code preference. During Agent Creator
      reinitialization, an existing value is preserved so a new Agent Creator phone-region request does
      not replace the already provisioned phone region while new-number buying is disabled.

      **Dependencies:**

      - **Primary Settings:**
        - `project_representative_agent_voice_phone_area_code`: First-choice area before fallback is used.
        - `project_representative_agent_voice_phone_alpha2_code`: Country context for both primary and
          fallback area-code selection.
      - **Logic Interactions:**
        - When the advanced system configuration
          `project_attributes_private_account_initialized_first_time` is `True`, first-time
          number-purchase flow is skipped.
    group: 2. Agent - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_representative_agent_voice_phone_area_code
    value: N/A
    title: Voice - AI Phone - Area Code Primary [C]
    description: |-
      Primary area code preference for provisioning the Agent phone number.

      **Pro-Tip:** Use a local area code your customers recognize, and always provide a fallback area
      code.

      **Examples:**

      - **`408`:** Try to provision in this area first.
      - **`650`:** Another valid primary choice based on local coverage goals.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Used during first-time phone provisioning to request a number in the preferred
      area. If unavailable, provisioning can continue with the fallback area code. It is also reused in
      some industry setup flows when composing default served-area phrasing.

      **Fallbacks:** Initialization reads this from `agent_creator_voice_channel_phone.area_code` when
      available. During phone purchase, Agent Creator phone payload is used directly when present; this
      attribute is used as the fallback area-code source for older accounts. If empty, provisioning may
      proceed without area-code preference. During Agent Creator reinitialization, an existing value is
      preserved so a new Agent Creator phone-region request does not replace the already provisioned phone
      region while new-number buying is disabled. This field is mainly relevant during account
      initialization.

      **Dependencies:**

      - **Primary Settings:**
        - `project_representative_agent_voice_phone_alpha2_code`: Country context required for area-code
          based number search.
        - `project_representative_agent_voice_phone_fallback_area_code`: Secondary area-code option when
          the primary area has no available numbers.
      - **Logic Interactions:**
        - When the advanced system configuration
          `project_attributes_private_account_initialized_first_time` is `True`, first-time
          number-purchase flow is skipped.
    group: 2. Agent - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_representative_agent_voice_phone_country_code
    value: "31"
    title: Voice - AI Phone - Country Code [C]
    description: |-
      Numeric country dialing code used as the default for phone formatting and parsing.

      **Pro-Tip:** Store only digits (no `+` sign), because downstream phone parsing expects numeric
      country code values.

      **Examples:**

      - **`1`:** Default dialing code for US/Canada contexts.
      - **`31`:** Dialing code for Netherlands context.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Automatically derived from the alpha-2 country code and injected into explicit
      constraints, transfer, reporting, user-information extraction, and phone-validation prompt schemas
      as the default dialing context.

      **Fallbacks:** If alpha-2 mapping is unavailable, this field is set to a null-like placeholder.
      System mapping can repopulate it when a valid alpha-2 value is available. Agent Creator phone
      payload can seed the alpha-2 source used by this mapping during first initialization. During Agent
      Creator reinitialization, the existing phone-region attributes are preserved while new-number buying
      is disabled, so this value continues to follow the preserved alpha-2 source.

      **Dependencies:**

      - **Primary Settings:**
        - When the advanced system configuration `project_representative_agent_voice_phone_alpha2_code` is
          present, it is used as the source for country-code mapping.
      - **Logic Interactions:**
        - `project_attributes_setting_transfer_call_phone_numbers`: Transfer-phone parsing treats this as
          the default country code.
    group: 2. Agent - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_representative_agent_voice_phone_alpha2_code
    value: NL
    title: Voice - AI Phone - ISO 3166-1 Alpha-2 Code [C]
    description: |-
      Two-letter ISO country code used for Agent phone-number provisioning (for example, `US`, `NL`).

      **Pro-Tip:** Keep this value uppercase and valid ISO 3166-1 alpha-2 to avoid provisioning errors.

      **Examples:**

      - **`US`:** United States provisioning context.
      - **`NL`:** Netherlands provisioning context.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Used as country context during first-time connector phone-number provisioning and
      to derive the numeric default country dialing code used in user phone normalization/extraction.

      **Fallbacks:** Initialization reads this from `agent_creator_voice_channel_phone.country_code` when
      available. During phone purchase, Agent Creator phone payload is used directly when present; this
      attribute is used as the fallback country source for older accounts. If missing, the system stores a
      null-like placeholder and later country-code mapping may produce no numeric country code. During
      Agent Creator reinitialization, an existing value is preserved so a new Agent Creator phone-region
      request does not replace the already provisioned phone region while new-number buying is disabled.

      **Dependencies:**

      - **Primary Settings:**
        - When the advanced system configuration `project_representative_agent_voice_phone_country_code`
          is present, it is derived from this alpha-2 code via internal country-code mapping.
      - **Logic Interactions:**
        - When the advanced system configuration `project_representative_agent_voice_phone_area_code` is
          provided, it is combined with this country context for number purchase requests.
        - When the advanced system configuration
          `project_representative_agent_voice_phone_fallback_area_code` is provided, it is treated as a
          secondary area preference within the same country context.
    group: 2. Agent - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_setting_voice_integration_service_voice_mode
    value: voice-to-voice
    title: Voice - Integration Service - Voice Mode [C] [IMPORTANT]
    description: |-
      Defines the operating mode for the platform-native voice integration.

      **Pro-Tip:** Use `voice-to-voice` or `speech-to-speech` for direct real-time spoken interaction, or
      `transcriber` when you need transcript-first behavior.

      **Examples:**

      - **`transcriber`:** Uses transcriber-oriented conversation-start flow.
      - **`voice-to-voice`:** Uses voice-to-voice conversation-start handling and spoken interaction.
      - **`speech-to-speech`:** Uses speech-to-speech conversation-start handling and spoken interaction.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Controls which conversation-start skills are activated for native voice channels
      and gates multiple runtime behaviors in prompt, waiting, and follow-up flows. `voice-to-voice` and
      `speech-to-speech` are handled as separate direct spoken-interaction modes.

      **Fallbacks:** Default initialization sets `voice-to-voice`. Connector sync logic propagates this
      value to native voice connectors.

      **Dependencies:**

      - **Primary Settings:**
        - When the advanced system configuration `project_attributes_setting_voice_integration_service` is
          set to the platform-native voice integration option, this mode controls native voice channel
          behavior.
        - `project_attributes_setting_voice_integration_service_voice_to_voice_provider`: Used when mode
          is `voice-to-voice`. `speech-to-speech` provider selection is managed in native voice connector
          settings rather than by this attribute.
      - **Logic Interactions:**
        - Voice-to-voice provider and native tool-calling settings apply only to `voice-to-voice`; they do
          not configure `speech-to-speech` provider routing or native tools.
    group: 2. Agent - Advanced
    is_hidden: true
    possible_values:
      - transcriber
      - voice-to-voice
      - speech-to-speech
    value_type: !enum "AttributeValueTypes.enum"
  - idn: project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_functions_description
    value: " "
    title: |-
      Voice - Integration Service - Voice To Voice Provider - GenAI - Functions (Tools)
      Description [C]
    description: |-
      This advanced setting stores the operator-authored text instructions that explain how voice-to-voice
      tools should be used.

      It gives the Agent a human-readable toolbox guide that complements the structured JSON tool schema.

      **Best Practice:** Keep each instruction mapped to the exact tool name in your JSON schema so the
      Agent’s reasoning instructions and callable tool definitions remain consistent. Leave this blank
      when you do not need operator-authored global tool instructions. The toolbox section header and
      system-managed native thoughts guidance are composed separately at runtime, so do not add them here
      manually.

      **Examples:**

      ```txt
      - Send full name as soon as the User is providing it verbally using the function (tool) called `send_full_name`.
      - Send phone number as soon as the User is providing it verbally using the function (tool) called `send_phone_number`.
      - Send email as soon as the User is providing it verbally using the function (tool) called `send_email`.
      - Send appointment type as soon as the User is providing it verbally using the function (tool) called `send_appointment_type`.
      - Send date and time as soon as the User is providing it verbally using the function (tool) called `send_date_and_time`.
      - Send number of people as soon as the User is providing it verbally using the function (tool) called `send_number_of_people`.
      - Send date of birth as soon as the User is providing it verbally using the function (tool) called `send_date_of_birth`.
      - Send company name as soon as the User is providing it verbally using the function (tool) called `send_company_name`.
      - Send website as soon as the User is providing it verbally using the function (tool) called `send_website_link`.
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** This text is the operator-authored source for voice GenAI toolbox guidance.
      Connector sync copies it into a runtime-composed toolbox description only when the tools-enabled
      toggle is `True`; native thoughts tooling can add additional system-managed guidance to that runtime
      description without mutating this text. Conversation prompt-building reads the composed value for
      GenAI `voice-to-voice` sessions; `speech-to-speech` uses its separate native voice connector path
      and does not use this voice-to-voice toolbox prompt path.

      **Fallbacks:** Common settings initialization keeps this operator-authored source blank.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_functions`:
          Structured schema this text should describe.
        - `project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_functions_enabled`:
          Controls whether this operator-authored guidance participates in the runtime toolbox
          description.
    group: 8. System
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_functions_enabled
    value: "False"
    title: |-
      Voice - Integration Service - Voice To Voice Provider - GenAI - Functions (Tools) Enabled
      [C]
    description: |-
      This advanced toggle enables or disables operator-authored GenAI function (tool) usage for
      `voice-to-voice` sessions.

      Use it to control whether the system includes your configured GenAI tools in the runtime voice tool
      set. System-managed native tools can still be activated by their own feature flags.

      Behavior by value:

      - **Enabled (`True`):** Operator-authored tool schemas/instructions participate in the runtime voice
        tool set.
      - **Disabled (`False`):** Operator-authored tool schemas/instructions are excluded from the runtime
        voice tool set. System-managed native tools may still make the runtime tool set active.

      **Best Practice:** Turn this on only after tool schemas and corresponding runtime handling are fully
      validated for your voice-to-voice flow.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** This flag controls whether the operator-authored GenAI tools and descriptions are
      copied into runtime-composed tool settings during connector sync. Prompt assembly and connector
      `genai_v2v_tools` use those runtime-composed settings, which may also include system-managed native
      tools from feature flags. The conversation toolbox path is used only for GenAI `voice-to-voice`
      sessions; `speech-to-speech` uses its separate native voice connector path and does not use this
      voice-to-voice toolbox prompt path.

      **Fallbacks:** Default is `False` in common settings.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_functions`:
          Operator-authored structured tool contract included in the runtime tool set only when enabled.
        - `project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_functions_description`:
          Operator-authored toolbox guidance included in the runtime toolbox description only when
          enabled.
