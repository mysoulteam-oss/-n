    title: Dynamic (LLM-based) - Schedule - Object [C]
    description: |-
      This advanced system configuration stores a structured per-day schedule object used for fast,
      deterministic open/closed checks.

      **Note:** This is a system-managed internal attribute. Its value is generated and updated
      automatically and can be overwritten by runtime workflows. Do not edit this attribute manually.

      **Best Practice:** Keep this field read-only and rely on the main working-hours setting to
      regenerate it whenever schedule definitions change.

      Example value:

      ```json
      {
        "Monday": {
          "working_day": true,
          "working_hours": ["090", "091", "092", "093", "094", "095", "100"]
        },
        "Sunday": {
          "working_day": false,
          "working_hours": []
        }
      }
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Schedule-object preparation builds this JSON from the business working-hours
      source, producing day-level `working_day` flags and 10-minute increment arrays used by runtime
      working-hours evaluators. Conversation and scheduling status checks use object lookups instead of
      full LLM reasoning when this object is available. Assessment workflows also read this object to
      classify current-time working-hours state.

      **Fallbacks:** If source schedule data is empty, this field is set to a whitespace placeholder. If
      this object is missing or a target day resolves to a generic "schedule not provided" marker,
      conversation-level status logic falls back to LLM-based working-hours evaluation. Regeneration is
      skipped when source schedule data is unchanged and this object is already populated. In assessment
      workflows, missing or unusable object/day entries fall back to the standard LLM-based working-hours
      status check instead of forcing a generic state.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_working_hours`: Source schedule text parsed to generate this structured
          schedule object.
      - **Logic Interactions:**
        - `project_attributes_private_dynamic_schedule_working_hours`: Used as fallback working-hours
          context when object-based status evaluation is unavailable.
        - `project_attributes_setting_define_conversation_is_during_working_hours_enabled`: Governs
          whether conversation-level runtime status checks execute.
        - `project_business_time_zone`: Determines day/time keys used when querying this object at
          runtime.
