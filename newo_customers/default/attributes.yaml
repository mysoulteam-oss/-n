  - idn: project_attributes_private_dynamic_schedule_compiled
    value: " "
    title: Dynamic - Schedule - Compiled [C]
    description: |-
      Structured JSON schedule produced by the WHE producer skill. Format: {"regular": {mon/tue/.../sun:
      [{open, close}]}, "exceptions": [{date, intervals, reason}]}

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** The WHE (Working Hours Engine) producer skill parses business working hours text
      into a deterministic JSON structure. The decision-point skill
      `session_get_working_hours_status.nslg` (CAMainFlow) consumes this attribute via the canonical
      `utils_session_is_open.nsl` helper and caches the resulting BOOL status (`"true"` / `"false"`) into
      the `working_hours_status` persona attribute — without LLM involvement. Assessor workflows also read
      this compiled schedule for deterministic working-hours classification before falling back to legacy
      schedule-object behavior.

      **Fallbacks:** If this attribute is empty or missing, the decision point falls back to the legacy
      HHM-based working hours evaluation path. The producer writes a whitespace placeholder when source
      schedule data is empty. Exception dates are parsed directly from the source
      `project_business_working_hours` text — no separate exceptions input is required.

      **Lifecycle:** The compiled JSON is regenerated only during initial account setup
      (`_postSetupAccountSkill`). Toggling the WHE flag or editing `project_business_working_hours` after
      setup will not refresh this attribute; re-run the setup flow to recompile.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_working_hours`: Source schedule text parsed by the producer (includes
          exception dates inline if present).
        - `project_business_time_zone`: Timezone used by the producer to resolve year-less exception dates
          and by consumers for local time calculations.
      - **Logic Interactions:**
        - `project_attributes_setting_working_hours_structured_format_enabled`: Feature flag that gates
          the decision point between legacy and WHE paths.
    group: 8. System
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.json"
