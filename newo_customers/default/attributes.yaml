  - idn: project_business_language_restricted_list
    value: "[]"
    title: 1-17. Language - Restricted Languages [B]
    description: |-
      Specify languages the Agent must avoid using in replies or automatic language switching.

      **Pro-Tip:** Enter only the languages you want blocked, using a JSON array of language names. Keep
      the list empty (`[]`) if there are no language restrictions.

      **Examples:**

      ```json
      ["Russian", "Chinese"]
      ```

      ```json
      []
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Stored as a JSON array and injected into shared language-selection guardrails.
      These restrictions are applied when the system decides whether it may switch languages, when it
      extracts `user_preferred_language` from conversation history, and when it prepares live reply
      instructions.

      **Fallbacks:** Common business initialization sets this attribute to an empty JSON list (`[]`) when
      no restrictions are provided. An empty list disables the restriction logic.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_language_primary`: This remains the business default language while this
          attribute defines which alternative languages are prohibited.
