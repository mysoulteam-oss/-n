  - idn: project_attributes_private_dynamic_first_customer_call_events_must_be_sent
    value: "False"
    title: Dynamic - First Customer Call Events Must Be Sent [C]
    description: |-
      This advanced system marker controls whether setup tooling is notified when the next eligible
      customer phone call starts and finishes. It opens a first-call callback window for demo setup and
      reinitialization, then closes that window when the call-ending callback is queued.

      **Note:** This is a system-managed internal attribute. Its value is generated and updated
      automatically and can be overwritten by runtime workflows. Do not edit this attribute manually.

      **Examples:**

      - **`False`:** Customer phone calls do not send first-call started or finished callbacks. This is
        the common default and keeps typical setup and existing accounts from sending these callbacks.
      - **`True`:** The next eligible customer phone call start sends the first-call started callback.
        When that phone call ends, the system sends the first-call finished callback and resets this
        marker to `False`.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Common setup initializes this marker to `False` when it is missing. Demo setup and
      Agent Creator reinitialization set it to `True`; standard setup does not enable it. When an eligible
      customer phone call starts while this marker is `True`, runtime emits the system event
      `agent_creator_first_customer_call_started`, which is an internal callback event that tells setup
      tooling a customer phone call started. The callback handler sends the external actor event
      `first_customer_call_started` with the Agent phone number, user phone number, and customer ID.
      Runtime intentionally keeps the marker enabled after the start callback so the matching finished
      callback can still be sent. When an eligible customer phone call ends while this marker is `True`,
      runtime emits `agent_creator_first_customer_call_finished`, which tells setup tooling the phone call
      finished. The callback handler sends the external actor event `first_customer_call_finished` with
      the same core payload fields. After enqueueing the finished callback, runtime resets this marker to
      `False`, so later phone calls do not send either first-call callback unless lifecycle logic enables
      the marker again.

      **Fallbacks:** Missing, empty, or `False` values suppress both first-call callbacks. A `True` value
      only dispatches callbacks for customer phone conversation start and end events.

      **Dependencies:**

      - **Primary Settings:**
        - None. Runtime lifecycle logic owns this marker.
      - **Logic Interactions:**
        - `project_representative_agent_voice_phone_number`: Included in the callback payload as the Agent
          phone number.
        - `agent_creator_actor_id`: Determines which setup-assistant actor receives the callback event.
    group: 8. System
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.bool"
