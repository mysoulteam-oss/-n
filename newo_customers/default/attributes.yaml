      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_hitl_monitoring_enabled`: When HITL reporting is enabled, this
          version value is forwarded in HITL payloads.
      - **Logic Interactions:**
        - None at attribute level for version preparation timing.
    group: 6. Support
    is_hidden: false
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_free_notes
    value: " "
    title: 6-02. Free Notes [A]
    description: |-
      This is a shared workspace note field for your business team and support team. Use it to keep
      operational notes, action items, troubleshooting context, and handoff details in one place.

      **Pro-Tip:** Keep notes short, dated, and action-oriented so anyone reviewing the account can
