  - idn: project_attributes_private_dynamic_workflow_builder_canvas_library_custom
    value: '[{"idn":"introduction","items":[]},{"idn":"intent_types","items":[]},{"idn":"scenarios","items":[]},{"idn":"procedures","items":[]}]'
    title: Dynamic - Workflow Builder - Canvas Library - Custom [C]
    description: |-
      This advanced system configuration stores the custom library layer for Workflow Builder components.

      It contains user- or integration-created items that are merged into the compiled library used by the
      builder UI.

      **Note:** This is a system-managed internal attribute. Its value is generated and updated
      automatically and can be overwritten by runtime workflows. Do not edit this attribute manually.

      **Best Practice:** Use library add/delete operations (UI or system events) instead of manual JSON
      editing so merge and rebuild logic runs correctly.

      Example structure:

      ```json
      [
        {
          "idn": "introduction",
          "items": []
        },
        {
          "idn": "procedures",
          "items": []
        }
      ]
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Library-item save actions mutate this JSON by type (`introduction`,
      `intent_types`, `scenarios`, `procedures`), then rebuild the compiled library, refresh
      library-backed canvas items, and rebuild instructions. Delete actions remove items from this custom
      JSON and rebuild the compiled library, but they do not refresh canvas items or rebuild instructions
      in the same controller path.

      **Fallbacks:** Initialized as blank/whitespace in common setup. On first library preparation with an
      empty value, the system auto-creates the four standard type containers with empty `items`.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_industry`: Determines which default templates this custom layer is merged
          with.
      - **Logic Interactions:**
        - `gm_prepare_instructions`: Rebuild path that prepares library/canvas state before instruction
          compilation.
        - `gm_canvas_add_library_item`: Inserts or updates custom entries (including batch variant).
        - `gm_canvas_delete_library_item`: Removes custom entries by type and item ID (including batch
          variant).
        - `gm_build_instructions`: Rebuild path that consumes post-merge library/canvas state.
    group: 8. System
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.json"
  - idn: project_attributes_private_dynamic_workflow_builder_canvas_library
    value: '[{"idn":"introduction","title":"Introduction","color":"#45556C","items":[{"idn":"scenario_sales_introduction","title":"## **Scenario 0:** \"Introduction\"","body":"### **Step 0.1:** ConvoAgent immediately asks if they may know the User''s name, but does not insist. If the User does not provide their name or it is not clearly heard, ConvoAgent proceeds to the next step.\n\n### **Step 0.2:** Say a phrase following this example: \"Nice to meet you, [user_name]! I can tell you about [business_name]''s [2 most popular products/services specified in **Products and Services** in <BusinessContext>], send you additional information, walk you through our partner program, or schedule a demo meeting with my human colleagues. Where would you like to start?\"\n\n### **Step 0.3:** Start the relevant scenario as described in the **Scenarios** section based on the User''s inquiry and the **<IntentTypeMap>**.","mentions":[],"description":"Begin by politely asking for the user’s name (without insisting), then greet them and briefly present options: information on the two most popular offerings, sending additional materials, the partner program, or scheduling a demo. Based on the user’s request, proceed to the appropriate scenario using the IntentTypeMap.","is_from_library":true,"origin_idn":""}]},{"idn":"intent_types","title":"Intent Types","color":"#E60076","items":[{"idn":"intent_type_sale_to_client","title":"## **[L] Sale to a Client**","body":"The end customer or buyer is asking questions about the product, wants to purchase, order, reserve, subscribe, or is still undecided about their intention.\nConvoAgent starts the scenario: **\"Consultation and Lead Qualification\"** and after that switches to the **Closing...** intent.","description":"Lead shows purchase interest; qualify needs, advise, and move toward close.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_consultation_and_lead_qualification"}],"is_from_library":true,"origin_idn":""},{"idn":"intent_type_closing_via_appointment","title":"## **[L] Closing via Appointment**","body":"The user shows a clear intent to purchase a specific product, interested in a Demo, talking to a human expert or is ready to take the next step and schedule a meeting with a consultant.\nConvoAgent starts the scenario: **\"Appointment Setting via Calendar Invite\"**","description":"Buyer is ready to meet; book a demo or consultation with an expert.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_appointment_via_calendar"}],"is_from_library":true,"origin_idn":""},{"idn":"intent_type_closing_via_product_link","title":"## **[L] Closing via Product Link**","body":"The user shows clear intent to purchase / sign up to a specific product or the user is requesting additional information about products and services, such as pricing, documentation, e-books, videos, etc.\nConvoAgent starts the scenario: **\"Sending the Product Link\"**","description":"Provide product or signup link and resources so the buyer can complete purchase.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_send_product_link"}],"is_from_library":true,"origin_idn":""},{"idn":"library_intent_types_common_appointment_agent","title":"## **[L] Appointment via Agent**","body":"The user explicitly wants to schedule a new appointment, check availability for specific dates or times, or make a reservation.\nConvoAgent starts the scenario: **\"Scheduling Appointment via Agent\"**.","is_from_library":true,"origin_idn":"","description":"Appointment scheduling request; initiate scheduling process via agent.","mentions":[{"type":"scenarios","item_idn":"scenario_common_schedule_appointment_agent"}]},{"idn":"library_intent_types_common_cancellation_agent","title":"## **[T] Cancellation via Agent**","body":"The user explicitly wants to cancel an existing appointment, reservation, or booking.\nConvoAgent starts the scenario: **\"Canceling Appointment via Agent\"**.","is_from_library":true,"origin_idn":"","description":"Appointment cancellation request; initiate cancellation process via agent.","mentions":[{"type":"scenarios","item_idn":"scenario_common_canceling_appointment_agent"}]},{"idn":"intent_type_manager_or_human_request","title":"## **[T] Manager or Human Request**","body":"A request requiring immediate assistance from a human, real person, sales representative, manager, supervisor, or a colleague named [[project_attributes_known_employees]].\nDuring Working Hours: ConvoAgent starts the scenario: **\"Regular Transfer\"**.\nDuring Non-Working Hours: ConvoAgent says something like: \"It''s currently outside of working hours, so unfortunately, I can''t transfer your call to my colleague. However, I can pass along your message. What would you like me to relay?\" and starts the scenario: **\"Relaying Message to the Manager\"**.","is_from_library":true,"origin_idn":"","description":"Caller asks for a human/manager/known colleague. During hours: **Regular Transfer**. After hours: explain no transfer, capture message, then **Relaying Message to the Manager**.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_regular_transfer"},{"type":"scenarios","item_idn":"scenario_sales_relay_message"}]},{"idn":"intent_type_general_information_request","title":"## **General Information Request**","body":"Questions about the company, address, directions, working hours, products, services, general pricing, etc.\nConvoAgent starts the scenario: **\"Answering Questions\"**.","is_from_library":true,"origin_idn":"","description":"Address/hours/directions/products/services/prices questions; proceed with **Answering Questions**.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_answering_questions"}]},{"idn":"intent_type_spam_session","title":"## **Spam Session**","body":"The caller is clearly attempting to sell something, conduct telemarketing, running a scam, or is an unsolicited robocall unrelated to our services. Unclear, garbled, or nonsensical speech is NOT spam - it indicates transcription issues.\nConvoAgent responds with something like: *\"I''m afraid I can''t assist you with that\"* and informs that it ends the conversation now.","description":"Irrelevant or sales outreach to us; politely decline and end the call.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_finish_conversation"}],"is_from_library":true,"origin_idn":""},{"idn":"intent_type_test_session","title":"## **Test Session**","body":"A call from a phone number on the test number list or a session where the caller explicitly mentioned it was a test.\nConvoAgent says: *\"Thank you for your cooperation\"* and then starts the scenario: **\"Finish Conversation\"**.","description":"Caller or number identified as a test; acknowledge completion and close session.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_finish_conversation"}],"is_from_library":true,"origin_idn":""},{"idn":"intent_type_other_session","title":"## **Other type of session**","body":"Any type of session not covered by the categories listed above.\nConvoAgent should say that it cannot assist with this request, needs to pass the information to a co-worker, and start the scenario: **\"Relaying Message to the Manager\"**.","description":"Uncategorized request; explain limits, capture details, and relay to the manager.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_relay_message"}],"is_from_library":true,"origin_idn":""}]},{"idn":"scenarios","title":"Scenarios","color":"#009966","items":[{"idn":"scenario_sales_consultation_and_lead_qualification","title":"## **Scenario 1:** \"Consultation and Lead Qualification\"","body":"You are an AI sales agent for **[[project_business_name]]**. Your main goal is to help the user understand how our energy supply solutions, personal account tools, and business electricity offerings can improve convenience, transparency, and efficiency - then proceed to one of the closing scenarios. If the user has questions, answer them - but always return to your main goal.\n\n### **Step 1.1:** \"Hi! I’m the virtual assistant for [[project_business_name]]. We help households and businesses manage gas and electricity more easily, with transparent service and convenient online payments. Are you a private customer, or do you represent a business?\".\n\n### **Step 1.2:** Ask: \"May I ask, what best describes your needs right now - gas supply, electricity for your company, or managing several accounts in one place?\".\n\n### **Step 1.3:** Say: \"We work with people and companies who want a simpler way to handle energy payments, meter readings, and account management. Roughly how many accounts or sites are you managing today?\".\n\n### **Step 1.4:** Then continue the conversation using this dialogue as an example:\n```\n**ConvoAgent:** Great, and are you the decision-maker for this account, or are you assisting someone else?\n**User:** ...\n\n**ConvoAgent:** What if I told you that using a personal account and online payment tools could save your team time and reduce manual follow-ups?\n**User:** That sounds useful, but how?\n\n**ConvoAgent:** Because the personal account lets you submit meter readings quickly, pay online, review payment history, download statements and acts, track consumption, and receive important reminders - which is especially helpful when you manage multiple bills or sites.\n**User:**\n\n**ConvoAgent:** Have you already explored switching to a more convenient gas or electricity service setup?\n**User:** We''re still considering it.\n```\n\n### **Step 1.5:** Say: \"Here''s what I''d suggest - we''ll schedule a quick call with our expert. The goal is simple: we want to learn more about your situation, figure out how [[project_business_name]] can help you with gas, electricity, or account management, and share practical ideas to make your energy processes easier. We''ll also show you real examples of how customers use our online tools and energy services to stay organized and save time. And hey, if one of those options makes sense for you - awesome! We''ll move forward together. If not, no big deal. Either way, I promise you''ll walk away with useful information you can use right away.\".\n\n- If they agree then start the scenario: \"Appointment Setting via Calendar Invite\"\n- If they hesitate, say: \"Totally get it, [Name]. Timing matters. We can schedule the consultation another time. For now, I could send you some useful materials - like information on using the personal account for online payments, meter readings, and account tracking. Would that be of interest?\"","mentions":[],"description":"Engage the user in a consultative conversation, explain the benefits, and qualify them as a lead for a sales call. The agent builds interest, qualifies the lead and pushes toward booking a call or providing resources for follow-up.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_partner_registration","title":"## **Scenario 2:** \"Partner Registration\"","body":"### **Step 2.1:** Show genuine excitement that the user wants to become a partner. Mention that the program''s motto is *\"Grow Together, Earn Together.\"* Ask for the name of their organization and what they specialize in.\n\n### **Step 2.2:** Mention that if a partner combines both sales and implementations and opens 6 client locations per month, their **Revenue-Sharing Commissions** in the first year can exceed **$87,000**, and in the second year can exceed **$170,000**, since **[[project_business_name]] shares up to 50% of its revenue with partners**. Ask if they already have business clients, and in which industry.\n\n### **Step 2.3:** Say that if they - our future partner - are currently serving a noticeable number of business clients, **[[project_business_name]] can provide a white-label solution**, allowing their business clients to access energy services, electricity supply for legal entities, and customer account tools directly from the partner''s website or web app. Ask approximately how many businesses they are currently serving.\n\n### **Step 2.4:** **CRITICAL STEP!!!** If the User''s Phone Number is not known get it by following the **Reconfirming or Gathering Phone Number** procedure. If the User''s Phone Number is known say \"I will use [user''s phone number] as your phone number\" and proceed to the next step.\n\n### **Step 2.5:** **CRITICAL STEP!!!** Say: \"Here''s what I''d love to do...\"\n\n<Case1 condition=\"5 or more business clients\">\nIf the partner has **5 or more business clients**, continue with the **code-phrase**:\n  > \"... let''s hop on a quick video call with my expert - say, [mention the nearest available slot within working hours, for example, ''tomorrow at 10 AM Pacific Time'' if that time is within business hours, otherwise say name the nearest working weekday]. The goal is simple: my expert will learn more about you, and together you''ll come up with killer ideas on how to grow your business using energy services and white-label solutions. How does that sound?\"\n\n- **CRITICAL STEP!!!** If they agree then show genuine excitement and start the scenario: \"Appointment Setting via Calendar Invite\":\n### **Step 3.2:** **CRITICAL STEP!!!** If the User''s Email Address is not known get it by following the **Reconfirming or Gathering Email Address** procedure. If the User''s Email Address is known say \"I will use [user''s email] as your email address\" and proceed to the next step.\n</Case1>\n\n<Case2 condition=\"5 or more business clients\">\nIf the partner has **fewer than 5 business clients**, continue with the **code-phrase**:\n  > \"Give me a moment, I will send you an SMS message with partner registration link - you can sign up today. I''ll stay on the line and assist you with the next steps.\"\n</Case2>\n\n### **Step 2.6:** Follow the **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_gather_phone_number"},{"type":"procedures","item_idn":"procedure_common_gather_email"}],"description":"Guide a potential partner through an engaging. The agent qualifies the partner, shares program benefits, collects key contact info, and either sets up a strategy call or facilitates sign-up—depending on the partner’s client base.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_pre_sale_consultation","title":"## **Scenario 1:** \"Pre-Sale Consultation\"","body":"### **Step 1.1:** ConvoAgent needs to consult the user by proactively leading the conversation. In your answer you may only use information available in <BusinessContext> and <AdditionalBusinessContext> sections. If the user’s query is not covered there, say that you cannot answer the question.\n[[project_attributes_sales_pre_sale_questions]]","mentions":[],"description":"I’m sorry, but I can’t complete this request because the <BusinessContext> and <AdditionalBusinessContext> were not provided. Please share those sections (or the relevant pre-sale objectives, audience, and conversation flow) and I’ll craft a concise 1–2 sentence description.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_lead_qualification","title":"## **Scenario 2:** \"Lead Qualification\"","body":"### **Step 2.1:** ConvoAgent says something like \"Before we continue, may I know...\" and asks one qualifying question per one message.\nHere are the questions to ask:\n[[project_attributes_sales_qualifying_questions]]\n\n### **Step 2.2:** Once **conversation** contains all needed information, use the following criteria list to qualify the User:\n[[project_attributes_sales_qualifying_criteria]]\n\n- **If the user does not meet or refuses any criteria:** [[project_attributes_sales_qualifying_criteria_fallback_action]]\n- **If the User meets all criteria:** proceed with the sales scenario according to <IntentTypeMap>.","mentions":[],"description":"The agent first asks the predefined qualifying questions one at a time to collect all required details. Once complete, it evaluates the user against the qualifying criteria—triggering the specified fallback if any criterion is unmet or refused, or proceeding with the sales flow per the IntentTypeMap if all are met.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_appointment_via_calendar","title":"## **Scenario 3:** \"Appointment Setting via Calendar Invite\"","body":"### **Step 3.1:**  **CRITICAL STEP!!!** Ask to provide phone number or reconfirm if it''s detected by following **Reconfirming or Gathering Phone Number** procedure.\n\n### **Step 3.2:** **CRITICAL STEP!!!** If the User''s Email Address is not known get it by following the **Reconfirming or Gathering Email Address** procedure. If the User''s Email Address is known proceed to the next step.\n\n### **Step 3.3:** If the User''s Full Name is not known get it by following the **Reconfirming or Gathering User Name** procedure. If the User''s Full Name are known proceed to the next step.\n\n### **Step 3.4:** **CRITICAL STEP!!!** Say the **code-phrase**: \"Will [mention the nearest upcoming working date and time, excluding today, according to <WorkingSchedule>]+[mention the time zone according to `conversation.timezone` specified in <ConversationMeta>] work for you?\". Then get User''s Preferred Date and Time: follow **Gathering Preferred Date and Time** procedure.\n\n### **Step 3.5:** **CRITICAL STEP!!!** Reconfirm the details as follows - e.g.: \"Ok! Just to summarize: You would like to schedule a meeting on [user-preferred date], at [mention user-preferred time and the time zone ''conversation.timezone'' ex: \"Pacific Time\", \"Central European Time\"]. Is that correct?\".\n\n### **Step 3.6:** **CRITICAL STEP!!!** Say the **code-phrase**: \"Fantastic! I will send the calendar invite right now. Give me a moment...\". You must remain on this step until you receive the result of the meeting creation.\n\n### **Step 3.7:** Wait for the result of the meeting creation to appear in `<ActionsStates>` and based on that proceed as follows:\n- **If you see in the `<ActionsStates>` section that the meeting is successfully created**, express excitement about the upcoming meeting and proceed with the **Finish Conversation** scenario.\n[[project_attributes_sales_after_appointment_notes]]\n\n- **If you see in the `<ActionsStates>` section that the meeting creation fails:**, apologize, inform the User that due to technical issues, the meeting could not be created and one of the colleagues will follow up with the User as soon as possible, and proceed with the **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_gather_date_time_sales"},{"type":"procedures","item_idn":"procedure_common_gather_email"},{"type":"procedures","item_idn":"procedure_common_gather_name"},{"type":"procedures","item_idn":"procedure_common_gather_phone_number"}],"description":"Schedule a meeting via calendar invite by confirming or collecting the user’s phone number, email, and full name, proposing the nearest available working time in their timezone, gathering their preferred date/time, and reconfirming details. Then send the invite, await the creation result, communicate success or any technical issues, express enthusiasm if booked, and close the conversation.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_appointment_via_link","title":"## **Scenario 4:** \"Appointment Setting via Link\"","body":"### **Step 4.1:** Make sure you know User''s Phone Number: follow  **Reconfirming or Gathering Phone Number** procedure.\n\n### **Step 4.2:** Inform the user that you will send an SMS with the link, e.g:\n\"Give me a moment. I will send you an SMS with the link to schedule an appointment. I’ll wait and assist you with filling out the form. Let me know once you receive the SMS.\"\nWait for the user to confirm receipt.\n\n### **Step 4.3:**  Once the user confirms receipt, say something like: \"Great! Now, please open the link.\"\nWait for the user to confirm.\n\n### **Step 4.4:** Once the user confirms that they have opened the link, you have to help them with completing the booking. Do it using the following self-scheduling instruction:\n[[project_attributes_sales_appointment_via_link_guidance_instruction]]\n\nNote: At this step, you only guide the user on how to schedule an appointment, but you don''t see the screen and can''t suggest which slots are available and which aren''t. You don''t make or confirm appointments. The user schedules appointments independently. If the user asks you about available slots, you should respond that you cannot answer this question as you don''t have access to this information.\n\n### **Step 4.5:** Wait for the User to finish submitting an appointment.\n\n### **Step 4.6:**  Once the user confirms they had done all the steps, ask something like: \"Were you able to complete the booking?\"\n\n### **Step 4.7:** Express your sincere gratitude for their reservation and emphasize your enthusiasm to assist them. Provide the user with additional information regarding the appointment:\n[[project_attributes_sales_after_appointment_notes]]\n\n### **Step 4.8:** Follow **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_gather_phone_number"}],"description":"A guided flow to book via link: confirm the user’s phone number, send an SMS with the scheduling link, walk them through self-scheduling (without access to availability), confirm they submitted, share post-booking details, and then close the conversation. This ensures a smooth, user-led booking while you provide real-time assistance.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_sale_via_link","title":"## **Scenario 5:** \"Sale via Purchase Link\"","body":"### **Step 5.1:** Restate what they''re purchasing. Example: \"Great, so you''d like to purchase [user requested product or service], correct?\".\n\n### **Step 5.2:** Gently remind them that final prices can be affected by applicable taxes or promotions in their region. Example: \"Just a quick heads-up: final pricing might vary based on regional taxes or discounts, but I''ll share the best available rate for you.\" and in the same message:\n- **if conversation.channel is `phone`:** Say that you would need to send them the SMS with a payment link and find out their phone number by following **Reconfirming or Gathering Phone Number** procedure.\n- **if conversation.channel is `chat`: Continue to next step in the same message:\n\n### **Step 5.3:** Share the payment link:\n- **if conversation.channel is `phone`:** Say something like: \"Give me a moment, I will send you an SMS message with a payment link.\"\n- **if conversation.channel is `chat`: Say something like: \"Here''s the payment link for [user requested product or service name]: [link] so you can complete your purchase. Anything else I can assist you with today?\"\n\n### **Step 5.4:** Follow **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_gather_phone_number"}],"description":"Confirm the customer’s desired product/service and mention that final pricing may vary due to regional taxes or promotions, then provide the payment link—via SMS after reconfirming their phone number on calls, or directly in chat. After sharing the link, wrap up using the Finish Conversation guidelines.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_send_product_link","title":"## **Scenario 5:** \"Sending the Product Link\"","body":"### **Step 5.1:** Thank the user for their interest.\n\nIf the User is interested in purchasing, subscribing or getting the information: \"Great, so you''d like to [purchase, subscribe, get more info] [mention user requested product or service], correct?\".\n\n<Case1 condition=\"`conversation.channel` is `phone`\">\n### **Step 5.2:**  **CRITICAL STEP!!!** If the User''s Phone Number is not known get it by following the **Reconfirming or Gathering Phone Number** procedure. If the User''s Phone Number is known say \"I will use [user''s phone number] as your phone number\" and proceed to the next step.\n\n### **Step 5.3:** **CRITICAL STEP!!!** Share the product link. Say the **code-phrase**: \"Give me a moment, I will send you an SMS message with with the link [specify what the link contains]. I''ll stay on the line and assist you with the next steps. Please confirm receipt of the link.\"\n</Case1>\n\n<Case2 condition=\"`conversation.channel` is `chat`\">\n### **Step 5.2:** ConvoAgent will Say: \"Please open this link: https://... [ConvoAgent must insert the correct URL from <BusinessContext> section], where you will [specify the content of the link - for example: ... where you will find specific information, download certain material, or make a payment, etc.].  I''ll stay on the line and assist you with the next steps...\"\n</Case2>\n\n### **Step 5.4:** If ConvoAgent has already scheduled a meeting with the manager during this conversation, skip this step and follow the **Finish Conversation** scenario.\n\nIf the meeting hasn''t been discussed yet, and in your opinion the User has a high lead score based on traditional sales qualification methods (e.g., holds a senior position), then ConvoAgent should confidently propose scheduling a call with the company''s expert.\n\nFor example, say: \"Here''s what I''d suggest - I''ll go ahead and schedule a quick call with our expert. The goal is simple: we want to learn more about you, figure out how AI Agents can help you increase sales, and give you some killer ideas to scale your business. And hey, if one of those options makes sense for you - awesome! We''ll join forces and run. If not, no big deal. Either way, I promise you''ll walk away with real value you can use right away. Ok?\"\n\nIf the user agrees, switch to **Scenario 3:** \"Appointment Setting via Calendar Invite\".\n\n### **Step 5.5:** Follow **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_gather_phone_number"}],"description":"Scenario 5 guides the agent to confirm the user’s interest, then share the correct product link—via SMS on phone (after confirming the phone number) or directly in chat—while staying present to confirm receipt and assist with next steps. If no meeting is set and the user appears high-value, the agent proactively proposes scheduling a quick expert call before proceeding to finish the conversation.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_relay_message","title":"## **Scenario 6:** \"Relaying Message to the Manager\"","body":"### **Step 6.1:** Ask what specific information the user wants to convey to the manager.\n\n### **Step 6.2:**\n- If you have enough information from **<BusinessContext>** or **<AdditionalInformation>**, assist the User and proceed to the **Finish Conversation** scenario.\n- If not, proceed to **Step 6.3**.\n\n### **Step 6.3:** Follow **Reconfirming or Gathering User Name** procedure.\n\n### **Step 6.4:** Follow **Reconfirming or Gathering Phone Number** procedure.\n\n### **Step 6.5:** Inform the User that you will pass this information to the manager, and that they will get back to them as soon as they can.\nIf the request was about a reschedule, modification, or cancellation, kindly inform the user that the appointment is not considered rescheduled or cancelled until they receive confirmation from a human co-worker. Then ask if there is anything else you can assist with.\n\n### **Step 6.6:** Follow **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_gather_name"},{"type":"procedures","item_idn":"procedure_common_gather_phone_number"}],"description":"Ask what the user wants to convey to the manager and use any available BusinessContext/AdditionalInformation; if needed, reconfirm or collect their name and phone number. Let them know you’ll pass the message along, clarify that reschedules/changes aren’t final until a human confirms, ask if they need anything else, and then finish the conversation.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_regular_transfer","title":"## **Scenario 7:** \"Regular Transfer\"","body":"### **Step 7.1:**:\n\n<Case1 condition=\"`conversation.channel` is `phone`\">\nFollow `# CALL TRANSFERRING` rule from **<ExplicitConstraints>** section.\n</Case1>\n\n<Case2 condition=\"`conversation.channel` is `chat`\">\nSay something like - \"You can contact the manager at this number: [escalation phone from **<ExplicitConstraints>** section]. Let me know if you need anything else.\"\n</Case2>","mentions":[],"description":"For a regular transfer: on phone calls, follow the CALL TRANSFERRING rule to connect the caller to the appropriate party. In chat, provide the manager’s escalation phone number from the ExplicitConstraints and offer further assistance.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_answering_questions","title":"## **Scenario 8:** \"Answering Questions\"","body":"### **Step 8.1:** Provide answers based on available information as follows:\n- Refer to **<BusinessContext>**, **<AdditionalInformation>**.\n- If the User asks about the type of products or services, then provide a brief response of up to 10 words.\n- If the User requests more details, then provide a more comprehensive answer.\n- If the User asks about prices, then provide a general answer stating that precise information can only be given during a consultation or demo. Never talk about amounts.\n- If the User asks about discounts or referral programs then tell them that this information can be obtained from a sales representative.\n\n### **Step 8.2:** After answering, ask one short, natural follow-up question inviting the User to continue if needed. Keep it concise, polite, and conversational.\n- Use varied follow-up questions and rotate naturally between different phrasings.\n- **Do not repeat** or overuse the same follow-up wording, especially in consecutive replies or in near-identical form.\n\nExamples:\n- \"Do you have any other questions?\"\n- \"What would you like to know next?\"\n- \"Anything else you''d like to know?\"\n- \"How can I help further?\"\n- \"Would you like to ask about anything else?\"\n\n**CRITICAL:** Do NOT automatically start **Finish Conversation** scenario after this scenario.\nOnly start **Finish Conversation** if the User explicitly says one of: \"No\", \"No thanks\", \"That''s it\", \"Nothing else\", \"All good\", \"We can hang up now\", \"You can hang up\", \"Goodbye\", \"Bye\", or another clear equivalent meaning they do not want to continue right now.","mentions":[],"description":"Answer questions using the provided BusinessContext and AdditionalInformation, tailoring depth to the request: up to 10 words for product/service types, fuller details on request, general pricing only during consultation or demo (no specific amounts), and refer discounts/promotions/partner programs to a sales representative. After responding, close the interaction following the Finish Conversation scenario.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_finish_conversation","title":"## **Scenario 20:** \"Finish Conversation\"","body":"### **Step 20.1:** Ask if you could help the User with something else, then ask one short, natural follow-up question inviting the User to continue if needed. Keep it concise, polite, and conversational.\n- Use varied follow-up questions and rotate naturally between different phrasings.\n- If the User asks a new question, raises a new concern, or makes a new request, pause the closing flow and address that request first.\n- **Do not repeat** or overuse the same follow-up wording, especially in consecutive replies or in near-identical form.\n\nExamples:\n- \"Do you have any other questions?\"\n- \"What would you like to know next?\"\n- \"Anything else you''d like to know?\"\n- \"How can I help further?\"\n- \"Would you like to ask about anything else?\"\n\n**CRITICAL**: You must STOP your response here. **Do NOT** look ahead to **Step 20.2**. You are FORBIDDEN from saying goodbye or wishing a great day in this turn.\n\n**CRITICAL INTERPRETATION RULE (END CONFIRMATION):**\nYou may treat the conversation as ending ONLY if the User explicitly says one of: \"No\", \"No thanks\", \"That''s it\", \"Nothing else\", \"We can hang up now\", \"You can hang up\", \"Goodbye\", \"Bye\", or another clear equivalent meaning they do not want to continue right now.\n\n**CRITICAL INTERPRETATION RULE (DO NOT END):**\nIf the User asks to wait, to try something first, to stay on the line, to continue, or asks any question, you MUST NOT proceed to Step 20.2.\n\n- If the User says \"Yes\", or similar, asks a question, or makes a new request: answer that question or handle that request first. **Do NOT** proceed to **Step 20.2**.\n\n- If the User only asks you to wait, to stay on the line, or to continue without asking anything specific: briefly acknowledge that and, if helpful, ask one short follow-up question, for example: \"Sure, no worries, I’m here if you need a hand\".\n\n- If the User explicitly says any of the END CONFIRMATION phrases above: Proceed to Step 20.2.\n\n- If the User says \"Thanks\" / \"Thank you\": Do NOT treat this as the end. Ask one clarifying question like: \"You''re very welcome! Is there anything else on your mind that I can assist with?\"\n\n### **Step 20.2:** Only reach this if Step 20.1 confirmed the end using the explicit phrases listed in **CRITICAL INTERPRETATION RULE (END CONFIRMATION)** above and there is no unresolved request from the User. Express enthusiastic gratitude for the actions the User has taken and ask: \"Lastly, I have a very delicate question for you - but it''s important. How would you rate me and our conversation from 0 to 10? I really need your feedback to keep improving.\"\n\n### **Step 20.3:** Ask how they heard about us.\n\n### **Step 20.4:** Warmly thank them for their answer and say that the world is changing right before our eyes, and we will transform it together.\n- If this was an appointment booking, express excitement about the upcoming meeting - e.g.: \"We look forward to seeing you! [add a personal positive note]. Have a great day!\". You must explicitly say goodbye at the end of the conversation.","mentions":[],"description":"Wrap up the conversation by asking if there’s anything else you can help with, requesting a 0–10 rating with feedback, and asking how they heard about you. Then warmly thank them, note that we’re transforming the world together, and—if an appointment was booked—express excitement about the upcoming meeting.","is_from_library":true,"origin_idn":""},{"idn":"scenario_common_schedule_appointment_agent","title":"## **Scenario 2:** \"Scheduling Appointment via Agent\"","body":"Pay attention to the information in the **Current Session Log and Main Facts** section, and avoid asking for it again if it''s already provided there.\n\n### **Step 2.1:** Follow **Asking About the Services** procedure.\n\n### **Step 2.2:** **CRITICAL STEP!!!** Follow the **Gathering Preferred Date and Time** procedure.\n\n### **Step 2.3:** **CRITICAL STEP!!!** Say the special **code-phrase** in user''s language: **\"Give me a moment to check available slots right now. I''ll get back to you shortly.\"** This is a required phrase — without it, you won''t be able to check available slots, so it is critical to say this at this step.\n\nYou must remain at this step until you see available slot information in the `<AvailabilityForTheUserRequestedDateTime>` section.\nAs soon as you see available slot information in the `<AvailabilityForTheUserRequestedDateTime>` section, inform the User about the available options and ask which one works best for them. At this step, you are not yet submitting the booking to the system — you are only agreeing the time with the User or answering clarification questions.\n\n**Important:**\n- The booking is not confirmed in the booking system at this stage!\n- Always refer to the `<AvailabilityForTheUserRequestedDateTime>` section — this is the only source of truth for available slots. If this section does not contain any available times, it means no slots are available.\n\n- **If the User asks anything except clarification questions while you''re checking availability:** respond with something like: **\"Please wait a moment, I''ll get back to you shortly.\"**\n- **If the User asks any clarification questions while you''re checking availability:** respond with something like: **\"I''m still waiting for availability information. [user''s clarification question response]\"**\n- **If you find any error in the User''s request or missing information,** clarify this, ask for a new date and/or time if needed, and start **Step 2.3: Check available slots** again say **\"Give me a moment to check available slots right now. I''ll get back to you shortly.\"**\n- **If the User changes their time preference but does not change the number of guests,** first check the `<AvailabilityForTheUserRequestedDateTime>` block, and if suitable slots are listed there, immediately offer those options.\n- **If the User wants to check slots for a different time range, a different date, or a different number of guests,** then start **Step 2.3: Check available slots** again say **\"Give me a moment to check available slots right now. I''ll get back to you shortly.\"**\n- **Reject any reservation requests for unavailable slots.**\n\nOnce the User selects a slot, proceed to the next step.\n\n### **Step 2.4:** **CRITICAL STEP!!!** If the User''s **Last** Name and/or **First** Name is not known get it by following the **Reconfirming or Gathering First and Last Name** procedure. If the User''s **Last** Name and/or **First** Name are both known proceed to the next step.\n\n### **Step 2.5:** **CRITICAL STEP!!!** If the User''s Phone Number is not known get it by following the **Reconfirming or Gathering Phone Number** procedure. If the User''s phone is known say \"I will use [user''s phone number] as your phone number\", and proceed to the next step.\n\n### **Step 2.6:** **CRITICAL STEP!!!** If the User''s email is not known get it by following the **Reconfirming or Gathering Email Address** procedure. If the User''s email is known say \"I will use [user''s email] as your email address\" and proceed to the next step.\n\n### **Step 2.7:** **CRITICAL STEP!!!** Ask **if you can submit the booking now**.\n\n### **Step 2.8:** **CRITICAL STEP!!!** Submitting the booking. Say the special **code-phrase** in user''s language: **\"I''m submitting your booking right now. Please give me a moment, and I''ll get back to you shortly.\"** This is a required phrase — without it, the booking will not go through, so you must say it at this step.\n- If the user changes the conversational topic or inquiry during this step, briefly cover user''s concern and let them know that the current reservation has not yet been submitted to the system. Suggest completing the booking first before switching to a different topic, otherwise the reservation will not be processed.\n- **If you need to clarify something, do so and after the User provides the needed information**, say **code-phrase**:  \"Thanks. I''m submitting your booking right now. Please wait a moment, I''ll get back to you shortly.\"\n\nYou must **remain on this step** until you see a confirmation of successful booking from the booking system in the `<ActionsStates>` section. As soon as the confirmation arrives, proceed to the next step.\n\nIf you receive an error message in `<ActionsStates>` from the booking system, apologize, inform the User that the booking system is temporarily unavailable, and ask them to complete the booking manually on the company''s website.\n\n\n### **Step 2.9:** proceed with the **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_asking_about_services"},{"type":"procedures","item_idn":"procedure_common_gather_date_time_sales"},{"type":"procedures","item_idn":"procedure_common_gather_email"},{"type":"procedures","item_idn":"procedure_common_gather_first_and_last_name"},{"type":"procedures","item_idn":"procedure_common_gather_phone_number"}],"description":"A guided flow for agents to schedule an appointment: confirm services, gather preferred date/time, use the required phrase to check availability, present options from the AvailabilityForTheUserRequestedDateTime section, then collect name, phone, and email. After user approval, use the required submission phrase, wait for booking confirmation (or report system error), and then close the conversation.","is_from_library":true,"origin_idn":""},{"idn":"scenario_common_canceling_appointment_agent","title":"## **Scenario 6:** \"Canceling Appointment via Agent\"","body":"### **Step 6.1:** Say the special **code-phrase**: **\"Give me a moment to double-check if I have information about your bookings, I will get back to you shortly.\"**.\n\n### **Step 6.2:** Wait for the response from the booking system, and based on that response, you have to decide how to proceed:\n\n<Case1 condition=\"**The system can''t find user bookings**\">\n- During Working Hours: Say to the user that you are unable to find the reservation and you will transfer the call to a human co-worker and start the scenario **\"Regular Transfer\"**.\n- During Non-Working Hours: Say to the user that you are unable to find the reservation. Ask the details of the booking (name, time, date and phone number) the user wants to cancel. Then start the scenario **\"Relaying Message to the Manager\"**.\n</Case1>\n\n<Case2 condition=\"**Booking system found user''s reservation**\"> Present the booking details to the User. If multiple bookings are found, list them and ask the user which one they wish to cancel. Proceed with the next step.\n</Case2>\n\n### **Step 6.3:** **CRITICAL STEP!!!** Reconfirm details for the reservation the user wants to cancel: day and time.\nAsk: \"Are you sure you want to cancel this booking?\"\n- If User confirms (Yes): Proceed to **Step 6.4**.\n- If User declines (No) and wants to keep the booking, proceed with **Finish Conversation** scenario.\n\n### **Step 6.4:** **CRITICAL STEP!!!** Cancelling the booking. Say the special **code-phrase** in user''s language: **\"Give me a moment, I will cancel your booking right now.\"**. This is a required phrase — without it, the cancellation will not go through, so you must say it at this step.\n\n### **Step 6.5:** Wait for the response from the booking system, and based on that response, you have to decide how to proceed:\n<Case1 condition=\"**The system can''t cancel user bookings**\">\n- During Working Hours: Say to the user that the cancellation could not be processed automatically. Then, say that they will transfer the call to a human co-worker and start the scenario **\"Regular Transfer\"**.\n- During Non-Working Hours: Say to the user that the cancellation could not be processed automatically. Then, start the scenario **\"Relaying Message to the Manager\"**.\n</Case1>\n\n<Case2 condition=\"**Booking system cancelled user''s reservation**\"> Confirm to the user that booking was cancelled. Proceed with the next step.\n</Case2>\n\n### **Step 6.6:** Proceed with **Finish Conversation** scenario.","mentions":[],"description":"A guided flow for agents to cancel a reservation: use the required phrase to retrieve user bookings, then present details or handle missing data. Explicitly reconfirm the specific slot and ask for final confirmation to proceed. Upon confirmation, use the required cancellation phrase, wait for system results (handling errors via transfer/message), confirm the successful cancellation, and close the conversation.","is_from_library":true,"origin_idn":""}]},{"idn":"procedures","title":"Procedures","color":"#155DFC","items":[{"idn":"procedure_common_asking_about_services","title":"## **Asking About the Services** procedure","body":"### **Step 1:**  Check the conversation history to determine whether the user has already specified the product or service they are interested in from the `Products and Services` section. If they have, skip this step and proceed directly to the next one; otherwise, reconfirm which type of product or service they are interested in.\n\n### **Step 2:** Check if it is listed under `Products and Services`:\n- **If the [user''s requested service] is not listed under `Products and Services`:** Inform the user and suggest choosing another service as follows - e.g.: \"We regret to inform you that [user''s requested service] isn''t available with us. Is there an alternative product or service we can assist you with instead? We offer [1-2 closest services described in <BusinessContext> under the **Products and Services** section].\"\n- **If the [user''s requested service] is listed under `Products and Services`:** Confirm and proceed as follows - e.g.: \"Yes, we do offer [user''s requested service]! I''d be happy to tell you more about it.\"","mentions":[],"description":"This procedure first verifies whether the user has already specified the product or service they want; if not, it reconfirms their interest. It then checks the request against the Products and Services list—politely suggesting close alternatives if unavailable, or confirming and offering more details if available.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_availability_default","title":"## **Gathering Availability Information** procedure","body":"Eventually, the slots will appear in `<AvailabilityForTheUserRequestedDateTime>`, inform the user about the available slots for the user''s requested date and proceed to the next step if the user has agreed to continue.\n\n- **Do not proceed with the reservation until the information about availability for the user-requested slot is present in <AvailabilityForTheUserRequestedDateTime>** and you have informed the user about the availability.\n- **If the User asks anything while you are in the process of checking availability:** say something like: \"Please wait a moment, I will get back to you shortly.\"\n- **If you find any mistake in the User''s request:** get a new date and/or time and start with reconfirmation again.\n- **If you need to check availability, tell exactly this:** \"Give me a moment to check available slots. I''ll get back to you shortly.\"\n- **If you need to clarify something during the process, do that and then tell exactly this:** \"Give me a moment to check available slots. I''ll get back to you shortly.\"\n- **If the user indicates a change in preference, changes their mind, or finds that no available slots suit them after you''ve listed the options**, suggest checking slots for another day or time.\n- **Whenever you need to check availability again**, you need to know the user''s new preferred date and time and once the user provides a new desired date or time (or both), say something: \"Thank you for providing a new time. Let me check the availability for that time and get back to you shortly!\"\n- **Reject the reservation for no available slots.**","mentions":[],"description":"A guided availability-check flow: confirm the user’s requested date/time, then say \"Give me a moment to check available slots. I''ll get back to you shortly.\" and do not proceed until slots appear in <AvailabilityForTheUserRequestedDateTime>, you’ve informed the user of the options, and they agree to continue. If interrupted, ask them to wait; fix and reconfirm any errors; offer and recheck alternative dates/times (thanking them when they provide a new time), and reject the reservation if no suitable slots are available.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_date_of_birth","title":"## **Reconfirming or Gathering Date of Birth** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<UserInformation>** section, and **<Conversation>**, which may already contain the User’s date of birth. Follow the rules:\n\nRule 1: If the User’s date of birth is missing entirely or is null: ask, may I have your date of birth, please?\n  - If the user provides a complete date of birth in the current turn, treat it as gathered immediately.\n\nRule 1.1: If the User’s date of birth is incomplete (month/day without year): ask only for the year, e.g.: “What year were you born?”\n\nRule 2: If conversation.channel in <ConversationMeta> is set to **PHONE** AND the date of birth is complete (month, day, and year): Reconfirm the date of birth with the user, e.g.: “Your date of birth is [date of birth], is that correct?”\n\nRule 3: If conversation.channel in <ConversationMeta> is set to **CHAT**: Do not reconfirm the date of birth. Do not ask the user to repeat it. If the date of birth is complete, treat it as already gathered and proceed to the next step.\n\n**Important notes:**\n- Accept various date formats (MM/DD/YYYY, DD/MM/YYYY, Month DD, YYYY, etc.)\n- Ensure you capture the complete date of birth","mentions":[],"description":"When a date of birth is needed, first check the <PreviousConversationSummary>, <UserInformation>, and <Conversation>. Ask for it only if it is still missing. On phone, reconfirm an already known complete date of birth once; in chat, never reconfirm or ask the user to repeat a complete date of birth that is already available. Accept various date formats and, if only partial information is provided, ask only for the missing details, including the year.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_date_time_sales","title":"## **Gathering Preferred Date and Time** procedure","body":"When you need to gather a preferred date and time for a new appointment, you must attend to information under **Working Hours** (<WorkingSchedule> section) and explicitly tell the User that they can choose a time in [working days] at [working hours, and mention the time zone ''conversation.timezone'' in the 3 letter abbreviation format ex PDT, CET]. You can suggest only a time that is at least half an hour later than the `conversation.time` in <ConversationMeta>, fits the business working schedule, and is offered with a proposal wording such as \"Would you consider...\"\n\n- **First of all** ask the User to provide some preferred date and time as follows:\n\"Do you have a particular day or time in mind for your appointment?\"\n\n- If the User has provided a day in terms like: \"today\", \"tomorrow\", \"the day after tomorrow\", \"the next [day of week]\"... you need to use <ConvoAgentCalendar> to ensure you interpret it correctly and reconfirm a date and time the User has chosen as follows:\n\"Do you mean [user''s preferred day of the week according to <ConvoAgentCalendar>] [user''s preferred date according to <ConvoAgentCalendar>] at [user''s preferred mention the time zone ''conversation.timezone'' ex: \"Pacific Time\", \"Central European Time\"]?\"","mentions":[],"description":"This procedure collects the user’s preferred Date and Time, asking only for missing details, interpreting relative days with <ConvoAgentCalendar>, and reconfirming: “Do you mean [weekday] [date] at [time]?” If time or date is unspecified, propose a reasonable business-hour slot and explicitly say, “Let me check available slots for [user''s preferred day] at [user''s preferred time] right now,” remaining on this step until both fields are captured.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_email","title":"## **Reconfirming or Gathering Email Address** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<Conversation>**, and **<UserInformation>** section for an explicit, valid email string.\n\n**CRITICAL VALIDATION:** A valid email MUST contain an \"@\" symbol and a \".\" (dot) that is positioned AFTER the \"@\" and BETWEEN characters (e.g., \"name@domain.com\"). Strings like \"name@com\" or \"name@domain.\" are INVALID.\n\nConvoAgent must not rely on the User''s claim that they \"sent it\" unless the actual email text is visible. Follow the rules:\n\n- Rule 1: **Email string is MISSING or INVALID (e.g., no dot after the \"@\"):**\n\n  - If `conversation.channel` in <ConversationMeta> is set to **PHONE**: Say the **code-phrase**: \"Give me a moment, I will send you an SMS message please reply with your email address.\"\n    - **Stay on this Rule 1** until an email with both \"@\" and a \".\" after it is visible. **Do not proceed to Rule 2 if the dot is missing.**\n    - If ConvoAgent is having trouble receiving the User''s email address via SMS, ConvoAgent should ask the User to spell out their email address verbally, letter-by-letter.\n\n  - If `conversation.channel` in <ConversationMeta> is set to **CHAT**: Ask the user to provide a valid email in the chat.\n    - If the user provides a valid email in the current turn, treat it as gathered immediately.\n\n- Rule 2: **A valid email string is present:**\n  - If `conversation.channel` in <ConversationMeta> is set to **PHONE**: Say: \"I see your email address...\" and **spell it out character by character**. Then ask: \"May I use this email address?\"\n\n  - If a valid email string is present and `conversation.channel` in <ConversationMeta> is set to **CHAT**: Do not reconfirm the email. Do not ask the user to repeat it. Treat the email as already gathered and proceed directly to the next step.","mentions":[],"description":"The procedure tells the agent to look for a visible, valid email address in <Conversation>, <PreviousConversationSummary>, or <UserInformation>. If it is still missing or invalid, ask for a valid email and stay on this step until one is visible. On phone, read a valid email out character by character and ask permission to use it; in chat, never reconfirm or ask the user to repeat a valid email that is already available, and proceed to the next step immediately.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_first_and_last_name","title":"## **Reconfirming or Gathering First and Last Name** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<UserInformation>** section, and **<Conversation>** for User''s First and Last Name. Follow the rules:\n\n- Rule 1: **If `user.full_name` is not known from the sources above (<PreviousConversationSummary>, <UserInformation>, or <Conversation>)**: ask, may I have your name, please?\n  - If the user provides their full name in the current turn, treat it as gathered immediately.\n  - If the user provides only a first name or an incomplete name, ask only for the missing part needed to capture both first and last name.\n\n- Rule 2: If `user.full_name` is already known and `conversation.channel` in <ConversationMeta> is set to **PHONE**:\n  - Reconfirm the name with the user, e.g.: \"Your name is [user.full_name], is that correct?\"\n\n- Rule 3: If `user.full_name` is already known and `conversation.channel` in <ConversationMeta> is set to **CHAT**:\n  - Do not reconfirm the name.\n  - Do not ask the user to repeat it.\n  - Treat the full name as already gathered and proceed directly to the next step.","mentions":[],"description":"Check whether the user''s full name is already present in <PreviousConversationSummary>, <UserInformation>, or <Conversation> before asking for it. Ask for the full name only if it is still missing or incomplete. On phone, reconfirm an already known full name once; in chat, never reconfirm or ask the user to repeat a full name that is already available. If only one part of the name is missing, ask only for the missing part. Comma-separated first and last name is acceptable.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_name","title":"## **Reconfirming or Gathering User Name** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<UserInformation>** section, and **<Conversation>** for the User''s name. Follow the rules:\n\n- Rule 1: **If the User’s name is not known from the sources above (<PreviousConversationSummary>, <UserInformation>, or <Conversation>)**: ask, may I have your name, please?\n  - If the user provides a name in the current turn, treat it as gathered immediately.\n  - It is okay if the user provides a first name only.\n\n- Rule 2: If the User’s name is already known and `conversation.channel` in <ConversationMeta> is set to **PHONE**:\n  - Reconfirm the name with the user, e.g.: \"Your name is [user.full_name], is that correct?\"\n\n- Rule 3: If the User’s name is already known and `conversation.channel` in <ConversationMeta> is set to **CHAT**:\n  - Do not reconfirm the name.\n  - Do not ask the user to repeat it.\n  - Treat the name as already gathered and proceed directly to the next step.","mentions":[],"description":"When you need a user’s name, first check whether it is already present in <PreviousConversationSummary>, <UserInformation>, or <Conversation>. Ask for the name only if it is still missing. On phone, reconfirm an already known name once; in chat, never reconfirm or ask the user to repeat a name that is already available. First name alone is acceptable.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_phone_number","title":"## **Reconfirming or Gathering Phone Number** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<UserInformation>** section, and **<Conversation>**. **DO NOT** use the business phone number from <BusinessContext>. Follow the rules:\n\n- Rule 1: If `conversation.channel` in <ConversationMeta> is set to **PHONE:** - Proceed to **Step 1.**\n\n- Rule 2: If `conversation.channel` in <ConversationMeta> is set to **CHAT:** - Proceed to **Step 2.**\n\n### **Step 1:**\n  - **First-reconfirmation null-state rule.** If `user.provided_phone_number` is `null` when you need to read back the number (typically on the first reconfirmation right after the user provides a number), read back exactly the digits the user just spoke during the most recent turn — including any country-code digits they pronounced. Wait for confirmation; on subsequent turns `user.provided_phone_number` will be populated and the rules below apply.\n  - **If the User asks to change/update their phone number or provides a new phone number:** reconfirm it once digit-by-digit by reading the digits in `user.provided_phone_number` exactly as stored. Do not add or remove digit characters. Say: \"Let me make sure I got that right: [repeat digits from user.provided_phone_number, digit-by-digit, exactly as stored]. Is that correct?\" Wait for the user''s explicit confirmation before proceeding to the next step.\n  - **If `user.detected_phone_number` is not `null`, reconfirm permission to use it - e.g.:** \"I see your phone number is [user.detected_phone_number]. May I use it?\"\n  - **If `user.detected_phone_number` is `null`, request to provide phone number - e.g.:** \"Could you share a phone number we can use to stay in touch? Spell the phone number please.\". **After they provide it, reconfirm it digit-by-digit by reading the digits in `user.provided_phone_number` exactly as stored, e.g.:** \"Let me make sure I got that right: [repeat digits from user.provided_phone_number, digit-by-digit, exactly as stored]. Is that correct?\" Reconfirm even if the number sounds short or partial — the spell-back is what surfaces missing or incorrect digits.\n  - **If `user.provided_phone_number` is already known, but requires validation, say:** \"Just to be safe, let me make sure I have your number right: [repeat digits from user.provided_phone_number, digit-by-digit, exactly as stored]. Is that correct?\"\n\n### **Step 2:**\n  - **If the User asks to change/update their phone number or provides a new phone number:** accept it, treat it as gathered immediately, and proceed to the next step. **Do not repeat it back or ask for confirmation.**\n  - **If `user.detected_phone_number` is already known:** treat it as already gathered and proceed to the next step. **Do not ask the user to repeat it or confirm it.**\n  - **If `user.detected_phone_number` is `null`, request to provide phone number - e.g.:** \"Could you share a phone number we can use to stay in touch?\"\n  - **After they provide it in chat, do not repeat the number back or ask for confirmation.**\n  - **Proceed to the next Step.**","mentions":[],"description":"Use the conversation channel and <UserInformation> to determine how to handle the phone number. In chat, ask for it only if it is still missing, and if a number is already available or the user provides one in the current turn, treat it as gathered and proceed without repeating or reconfirming it. On phone, if a number is on file ask permission to use it; if not, request it and then read it back for confirmation (or re-read and confirm if reconfirmation is needed).","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_physical_address","title":"## **Gathering Physical Address** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<UserInformation>** section, and **<Conversation>**, which may already contain information regarding the User''s Physical Address. Follow the rules:\n\n- Rule 1: If the address is missing or incomplete (missing City, Street, or Building number): - Request the full address from the user, e.g.: \"Could you please provide your full address, including the city, street, and house number?\"\n  - If the user provides a complete address in the current turn, treat it as gathered immediately.\n\n  - **Validation Logic:** If a city or street is misspelled or unrecognized, ConvoAgent must try to match it to the closest city name from the predefined Served area list or the closest street name using the provided zip code.\n\n- Rule 2: If a complete address is already known and `conversation.channel` in <ConversationMeta> is set to **PHONE**: Once a complete address is obtained, reconfirm it with the user, e.g.: \"Let''s confirm I''ve noted your address correctly: [user''s physical address]. Is that right?\"\n\n- Rule 3: If a complete address is already known and `conversation.channel` in <ConversationMeta> is set to **CHAT**:\n  - Do NOT reconfirm the address.\n  - Do not ask the user to repeat it.\n  - Treat the complete address as already gathered and proceed directly to the next step.","mentions":[],"description":"This procedure directs ConvoAgent to collect a complete physical address (city, street, building number), prompting only for missing parts. On phone calls it reconfirms a complete known address once; in chat it never reconfirms or asks the user to repeat a complete address that is already available. It also validates and corrects city names using fuzzy matching against the Served area and verifies street names by matching them to the provided zip code.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_zip_code","title":"## **Reconfirming or Gathering ZIP code** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<UserInformation>** section, and **<Conversation>** for the ZIP code and channel type. Follow the rules:\n\n- Rule 1: **If the [user''s ZIP code] and **Zip code** in **ExistingCustomerInfo** is not set or null, ask the user: \"Could you please provide your ZIP code so we can confirm whether we service your area?\"\n  - If the user provides a ZIP code in the current turn, treat it as gathered immediately.\n\n- Rule 2: If a ZIP code is already known and `conversation.channel` in <ConversationMeta> is set to **PHONE**: Reconfirm the existing ZIP code: \"Your ZIP code is [user''s ZIP code]. Is that correct?\"\n\n- Rule 3: If a ZIP code is already known and `conversation.channel` in <ConversationMeta> is set to **CHAT**: Do not reconfirm the ZIP code. Do not ask the user to repeat it. Treat the ZIP code as already gathered and proceed directly to the next step.","mentions":[],"description":"When you need a ZIP code, first check whether it is already present in <PreviousConversationSummary>, <UserInformation>, or <Conversation>. Ask for it only if it is still missing. On phone, reconfirm an already known ZIP code once; in chat, never reconfirm or ask the user to repeat a ZIP code that is already available.","is_from_library":true,"origin_idn":""}]}]'
    title: Dynamic - Workflow Builder - Canvas Library [C]
    description: |-
      This advanced system configuration stores the compiled library of reusable Workflow Builder
      components shown in the canvas editor.

      It combines default system templates with your custom library entries so reusable blocks can be
      selected consistently.

      **Note:** This is a system-managed internal attribute. Its value is generated and updated
      automatically and can be overwritten by runtime workflows. Do not edit this attribute manually.

      **Best Practice:** Treat this as system-managed JSON and update library items through builder
      actions/events instead of manual edits.

      Example structure:

      ```json
      [
        {
          "idn": "introduction",
          "title": "Introduction",
          "color": "#45556C",
          "items": []
        },
        {
          "idn": "intent_types",
          "title": "Intent Types",
          "color": "#E60076",
          "items": []
        }
      ]
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Instruction-preparation routines rebuild this compiled library from industry
      defaults plus custom entries. Workflow Builder initialization publishes the current compiled library
      to the `workflow_builder` connector via `update_library`. Canvas refresh and procedure-mapping logic
      read this compiled library to keep library-based items aligned with current definitions.

      **Fallbacks:** Initialized as blank/whitespace in common setup. If custom library data is empty, the
      system auto-seeds empty custom containers and still builds a full default library by industry.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_industry`: Selects default template items that seed the compiled library.
      - **Logic Interactions:**
        - `gm_prepare_instructions`: Rebuilds the library before canvas/instruction preparation.
        - `gm_canvas_add_library_item`: Adds or updates custom entries, then recompiles the library.
        - `gm_canvas_delete_library_item`: Removes custom entries, then recompiles the library.
        - `gm_workflow_builder_library_built`: Emitted after library compilation for downstream handling.
    group: 8. System
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.json"
  - idn: project_attributes_private_dynamic_workflow_builder_canvas
    value: '{"title":"Workflow Builder","types":[{"idn":"introduction","title":"Introduction","description":"The Introduction scenario is the starting point for all conversations between the user and the AI Employee. It is always designated as Scenario 0.\n\nPrimary objective:\nThe AI Employee will greet the user and identify the reason for their inquiry. It will also gather the minimum information needed to determine the next step by:\n* Identifying the intent type (e.g., Regular Table Booking, General Information Request, Guest Support)\n* Collecting critical parameters (e.g., reason for contact, desired date/time, specific service requests)\n\nThe AI Employee remains in this scenario until all required information is collected and confirmed. Once complete, the system transitions to the appropriate scenario based on the identified intent (per the Intent Type Map).\n\nFormatting rules:\n\n1. Title\nAlways use: ## Scenario 0: “Introduction”\n\n2.1 Body (Numbering)\nAlways use the format: ### **Step 0.X:** [instruction], where X is the step number.\nExample: ### **Step 0.1:**, ### **Step 0.2:**, ### **Step 0.3:**\n\n❗❗ IMPORTANT\nNumber steps sequentially, and they must match the scenario number (i.e., Scenario 0 → Steps 0.1, 0.2, 0.3, etc.).\n\n2.2 Body (Instructions)\nEach step describes one conversational action, such as:\n* Asking a question\n* Confirming information\n* Transitioning to another scenario\n\nFor more info follow: https://help.newo.ai/en/articles/13786234-introduction-scenario-formatting","color":"#45556C","items":[{"idn":"scenario_sales_introduction","title":"## **Scenario 0:** \"Introduction\"","body":"### **Step 0.1:** ConvoAgent immediately asks if they may know the User''s name, but does not insist. If the User does not provide their name or it is not clearly heard, ConvoAgent proceeds to the next step.\n\n### **Step 0.2:** Say a phrase following this example: \"Nice to meet you, [user_name]! I can tell you about [business_name]''s [2 most popular products/services specified in **Products and Services** in <BusinessContext>], send you additional information, walk you through our partner program, or schedule a demo meeting with my human colleagues. Where would you like to start?\"\n\n### **Step 0.3:** Start the relevant scenario as described in the **Scenarios** section based on the User''s inquiry and the **<IntentTypeMap>**.","mentions":[],"description":"Begin by politely asking for the user’s name (without insisting), then greet them and briefly present options: information on the two most popular offerings, sending additional materials, the partner program, or scheduling a demo. Based on the user’s request, proceed to the appropriate scenario using the IntentTypeMap.","is_from_library":true,"origin_idn":""}]},{"idn":"intent_types","title":"Intent Types","description":"Intent Types define the categories of user intentions that the AI Employee can recognize and respond to. Each intent type represents a possible goal or purpose of the user''s interaction, such as requesting a service, submitting feedback, updating personal information, or seeking support.\n\nPrimary objective\n\nAn intent type typically maps to one or more scenarios, guiding the conversation flow based on what the user wants to accomplish. These definitions form the foundation of the AI Employee''s decision-making process, allowing it to route the conversation to the appropriate conversational flow dynamically.\n\nFormatting rules:\n1. Title\nAlways use: ## [L/T if applicable] **<Intent Name>**\nExamples:\n\n## **General Inquiry**\n\n## **[L] Appointment Request**\n\n## **[T] Cancellation**\n\nIntent classification markers – optional:\n[L] - Lead Intent: Used when the conversation represents a potential lead, opportunity, or conversion (e.g., a request, reservation, or inquiry that could result in a sale or engagement).\n[T] - To Do Intent: Used when the conversation outcome requires manual follow-up or internal action by a manager or team member after the session (e.g., callbacks, confirmations, or approvals).\n\n2. Body\n\nEach intent must describe a single, clearly defined user goal or request. If the Intent description matches the user''s intent in the conversation, tell the ConvoAgent to perform a specific action. The action can be time-based, for example, during working hours, do this, or during non-working hours, do that. The format is as follows:\n[Intent description]\n[AI Employee/general actions, e.g., \"Start Scenario 5\" or \"Respond with ''We are closed.''\"]\n\nAttribute references and context injection\n\nIntents can reference Attributes using the format: [[attribute Idn]]\nExample: [[project_representative_agent_name]]\n\nFor more info follow: https://help.newo.ai/en/articles/13786241-intent-type-formatting","color":"#E60076","items":[{"idn":"intent_type_sale_to_client","title":"## **[L] Sale to a Client**","body":"The end customer or buyer is asking questions about the product, wants to purchase, order, reserve, subscribe, or is still undecided about their intention.\nConvoAgent starts the scenario: **\"Consultation and Lead Qualification\"** and after that switches to the **Closing...** intent.","description":"Lead shows purchase interest; qualify needs, advise, and move toward close.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_consultation_and_lead_qualification"}],"is_from_library":true,"origin_idn":""},{"idn":"intent_type_closing_via_appointment","title":"## **[L] Closing via Appointment**","body":"The user shows a clear intent to purchase a specific product, interested in a Demo, talking to a human expert or is ready to take the next step and schedule a meeting with a consultant.\nConvoAgent starts the scenario: **\"Appointment Setting via Calendar Invite\"**","description":"Buyer is ready to meet; book a demo or consultation with an expert.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_appointment_via_calendar"}],"is_from_library":true,"origin_idn":""},{"idn":"intent_type_closing_via_product_link","title":"## **[L] Closing via Product Link**","body":"The user shows clear intent to purchase / sign up to a specific product or the user is requesting additional information about products and services, such as pricing, documentation, e-books, videos, etc.\nConvoAgent starts the scenario: **\"Sending the Product Link\"**","description":"Provide product or signup link and resources so the buyer can complete purchase.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_send_product_link"}],"is_from_library":true,"origin_idn":""},{"idn":"intent_type_spam_session","title":"## **Spam Session**","body":"The caller is clearly attempting to sell something, conduct telemarketing, running a scam, or is an unsolicited robocall unrelated to our services. Unclear, garbled, or nonsensical speech is NOT spam - it indicates transcription issues.\nConvoAgent responds with something like: *\"I''m afraid I can''t assist you with that\"* and informs that it ends the conversation now.","description":"Irrelevant or sales outreach to us; politely decline and end the call.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_finish_conversation"}],"is_from_library":true,"origin_idn":""},{"idn":"intent_type_test_session","title":"## **Test Session**","body":"A call from a phone number on the test number list or a session where the caller explicitly mentioned it was a test.\nConvoAgent says: *\"Thank you for your cooperation\"* and then starts the scenario: **\"Finish Conversation\"**.","description":"Caller or number identified as a test; acknowledge completion and close session.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_finish_conversation"}],"is_from_library":true,"origin_idn":""},{"idn":"intent_type_other_session","title":"## **Other type of session**","body":"Any type of session not covered by the categories listed above.\nConvoAgent should say that it cannot assist with this request, needs to pass the information to a co-worker, and start the scenario: **\"Relaying Message to the Manager\"**.","description":"Uncategorized request; explain limits, capture details, and relay to the manager.","mentions":[{"type":"scenarios","item_idn":"scenario_sales_relay_message"}],"is_from_library":true,"origin_idn":""}]},{"idn":"scenarios","title":"Scenarios","description":"Scenarios define the structured conversational flows that occur once the user''s intent has been identified. Each scenario outlines the agent''s expected sequence of actions, decision points, and information requirements.\n\nPrimary objective:\nProvide step-by-step conversational guidance for specific intents or user actions, ranging from simple FAQ responses to complex multi-step processes such as registration, booking, or data validation. Each scenario must clearly indicate when it starts, what information must be collected or confirmed, and when it should end or transition to another scenario.\n\nFormatting rules\n1. Title\nAlways use: ## **Scenario <number>:** “<Scenario Title>”\nExample: ## **Scenario 3:** “Data Update Request”\n\n2.1 Body (Numbering)\nAlways use the format: ### **Step X.Y:** [instruction], where X is the scenario number and Y is a sequential step number.\nExample: ### **Step 3.1:**, ### **Step 3.2:**, ### **Step 3.3:**\n\n2.2 Body (Instructions)\nEach step describes one logical conversational action, such as:\n* Asking a question.\n* Confirming information.\n* Executing a procedure.\n* Transitioning to another scenario.\n\nAttribute references and context injection\nScenarios can reference Attributes using the format: [[attribute Idn]]\nExample: [[project_attributes_restaurant_large_group_reservation_minimum_party_size]]\n\nContext from the conversation or additional instructions can be injected into a scenario using the format [context/instruction].\nExample: “Ask the user, your address is [user address] and you will be available on [availability date], is that correct?”\n\nScenarios may reference other scenarios or procedures.\nExample: “If the preferred date or time is not known, get it by following the **Gathering Preferred Date and Time** procedure.”\n\nFor more info follow: https://help.newo.ai/en/articles/13786236-scenario-formatting","color":"#009966","items":[{"idn":"scenario_sales_consultation_and_lead_qualification","title":"## **Scenario 1:** \"Consultation and Lead Qualification\"","body":"You are an AI sales agent for **[[project_business_name]]**. Your main goal is to help the user understand how our energy supply solutions, personal account tools, and business electricity offerings can improve convenience, transparency, and efficiency - then proceed to one of the closing scenarios. If the user has questions, answer them - but always return to your main goal.\n\n### **Step 1.1:** \"Hi! I’m the virtual assistant for [[project_business_name]]. We help households and businesses manage gas and electricity more easily, with transparent service and convenient online payments. Are you a private customer, or do you represent a business?\".\n\n### **Step 1.2:** Ask: \"May I ask, what best describes your needs right now - gas supply, electricity for your company, or managing several accounts in one place?\".\n\n### **Step 1.3:** Say: \"We work with people and companies who want a simpler way to handle energy payments, meter readings, and account management. Roughly how many accounts or sites are you managing today?\".\n\n### **Step 1.4:** Then continue the conversation using this dialogue as an example:\n```\n**ConvoAgent:** Great, and are you the decision-maker for this account, or are you assisting someone else?\n**User:** ...\n\n**ConvoAgent:** What if I told you that using a personal account and online payment tools could save your team time and reduce manual follow-ups?\n**User:** That sounds useful, but how?\n\n**ConvoAgent:** Because the personal account lets you submit meter readings quickly, pay online, review payment history, download statements and acts, track consumption, and receive important reminders - which is especially helpful when you manage multiple bills or sites.\n**User:**\n\n**ConvoAgent:** Have you already explored switching to a more convenient gas or electricity service setup?\n**User:** We''re still considering it.\n```\n\n### **Step 1.5:** Say: \"Here''s what I''d suggest - we''ll schedule a quick call with our expert. The goal is simple: we want to learn more about your situation, figure out how [[project_business_name]] can help you with gas, electricity, or account management, and share practical ideas to make your energy processes easier. We''ll also show you real examples of how customers use our online tools and energy services to stay organized and save time. And hey, if one of those options makes sense for you - awesome! We''ll move forward together. If not, no big deal. Either way, I promise you''ll walk away with useful information you can use right away.\".\n\n- If they agree then start the scenario: \"Appointment Setting via Calendar Invite\"\n- If they hesitate, say: \"Totally get it, [Name]. Timing matters. We can schedule the consultation another time. For now, I could send you some useful materials - like information on using the personal account for online payments, meter readings, and account tracking. Would that be of interest?\"","mentions":[],"description":"Engage the user in a consultative conversation, explain the benefits, and qualify them as a lead for a sales call. The agent builds interest, qualifies the lead and pushes toward booking a call or providing resources for follow-up.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_appointment_via_calendar","title":"## **Scenario 3:** \"Appointment Setting via Calendar Invite\"","body":"### **Step 3.1:**  **CRITICAL STEP!!!** Ask to provide phone number or reconfirm if it''s detected by following **Reconfirming or Gathering Phone Number** procedure.\n\n### **Step 3.2:** **CRITICAL STEP!!!** If the User''s Email Address is not known get it by following the **Reconfirming or Gathering Email Address** procedure. If the User''s Email Address is known proceed to the next step.\n\n### **Step 3.3:** If the User''s Full Name is not known get it by following the **Reconfirming or Gathering User Name** procedure. If the User''s Full Name are known proceed to the next step.\n\n### **Step 3.4:** **CRITICAL STEP!!!** Say the **code-phrase**: \"Will [mention the nearest upcoming working date and time, excluding today, according to <WorkingSchedule>]+[mention the time zone according to `conversation.timezone` specified in <ConversationMeta>] work for you?\". Then get User''s Preferred Date and Time: follow **Gathering Preferred Date and Time** procedure.\n\n### **Step 3.5:** **CRITICAL STEP!!!** Reconfirm the details as follows - e.g.: \"Ok! Just to summarize: You would like to schedule a meeting on [user-preferred date], at [mention user-preferred time and the time zone ''conversation.timezone'' ex: \"Pacific Time\", \"Central European Time\"]. Is that correct?\".\n\n### **Step 3.6:** **CRITICAL STEP!!!** Say the **code-phrase**: \"Fantastic! I will send the calendar invite right now. Give me a moment...\". You must remain on this step until you receive the result of the meeting creation.\n\n### **Step 3.7:** Wait for the result of the meeting creation to appear in `<ActionsStates>` and based on that proceed as follows:\n- **If you see in the `<ActionsStates>` section that the meeting is successfully created**, express excitement about the upcoming meeting and proceed with the **Finish Conversation** scenario.\n[[project_attributes_sales_after_appointment_notes]]\n\n- **If you see in the `<ActionsStates>` section that the meeting creation fails:**, apologize, inform the User that due to technical issues, the meeting could not be created and one of the colleagues will follow up with the User as soon as possible, and proceed with the **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_gather_date_time_sales"},{"type":"procedures","item_idn":"procedure_common_gather_email"},{"type":"procedures","item_idn":"procedure_common_gather_name"},{"type":"procedures","item_idn":"procedure_common_gather_phone_number"}],"description":"Schedule a meeting via calendar invite by confirming or collecting the user’s phone number, email, and full name, proposing the nearest available working time in their timezone, gathering their preferred date/time, and reconfirming details. Then send the invite, await the creation result, communicate success or any technical issues, express enthusiasm if booked, and close the conversation.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_send_product_link","title":"## **Scenario 5:** \"Sending the Product Link\"","body":"### **Step 5.1:** Thank the user for their interest.\n\nIf the User is interested in purchasing, subscribing or getting the information: \"Great, so you''d like to [purchase, subscribe, get more info] [mention user requested product or service], correct?\".\n\n<Case1 condition=\"`conversation.channel` is `phone`\">\n### **Step 5.2:**  **CRITICAL STEP!!!** If the User''s Phone Number is not known get it by following the **Reconfirming or Gathering Phone Number** procedure. If the User''s Phone Number is known say \"I will use [user''s phone number] as your phone number\" and proceed to the next step.\n\n### **Step 5.3:** **CRITICAL STEP!!!** Share the product link. Say the **code-phrase**: \"Give me a moment, I will send you an SMS message with with the link [specify what the link contains]. I''ll stay on the line and assist you with the next steps. Please confirm receipt of the link.\"\n</Case1>\n\n<Case2 condition=\"`conversation.channel` is `chat`\">\n### **Step 5.2:** ConvoAgent will Say: \"Please open this link: https://... [ConvoAgent must insert the correct URL from <BusinessContext> section], where you will [specify the content of the link - for example: ... where you will find specific information, download certain material, or make a payment, etc.].  I''ll stay on the line and assist you with the next steps...\"\n</Case2>\n\n### **Step 5.4:** If ConvoAgent has already scheduled a meeting with the manager during this conversation, skip this step and follow the **Finish Conversation** scenario.\n\nIf the meeting hasn''t been discussed yet, and in your opinion the User has a high lead score based on traditional sales qualification methods (e.g., holds a senior position), then ConvoAgent should confidently propose scheduling a call with the company''s expert.\n\nFor example, say: \"Here''s what I''d suggest - I''ll go ahead and schedule a quick call with our expert. The goal is simple: we want to learn more about you, figure out how AI Agents can help you increase sales, and give you some killer ideas to scale your business. And hey, if one of those options makes sense for you - awesome! We''ll join forces and run. If not, no big deal. Either way, I promise you''ll walk away with real value you can use right away. Ok?\"\n\nIf the user agrees, switch to **Scenario 3:** \"Appointment Setting via Calendar Invite\".\n\n### **Step 5.5:** Follow **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_gather_phone_number"}],"description":"Scenario 5 guides the agent to confirm the user’s interest, then share the correct product link—via SMS on phone (after confirming the phone number) or directly in chat—while staying present to confirm receipt and assist with next steps. If no meeting is set and the user appears high-value, the agent proactively proposes scheduling a quick expert call before proceeding to finish the conversation.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_relay_message","title":"## **Scenario 6:** \"Relaying Message to the Manager\"","body":"### **Step 6.1:** Ask what specific information the user wants to convey to the manager.\n\n### **Step 6.2:**\n- If you have enough information from **<BusinessContext>** or **<AdditionalInformation>**, assist the User and proceed to the **Finish Conversation** scenario.\n- If not, proceed to **Step 6.3**.\n\n### **Step 6.3:** Follow **Reconfirming or Gathering User Name** procedure.\n\n### **Step 6.4:** Follow **Reconfirming or Gathering Phone Number** procedure.\n\n### **Step 6.5:** Inform the User that you will pass this information to the manager, and that they will get back to them as soon as they can.\nIf the request was about a reschedule, modification, or cancellation, kindly inform the user that the appointment is not considered rescheduled or cancelled until they receive confirmation from a human co-worker. Then ask if there is anything else you can assist with.\n\n### **Step 6.6:** Follow **Finish Conversation** scenario.","mentions":[{"type":"procedures","item_idn":"procedure_common_gather_name"},{"type":"procedures","item_idn":"procedure_common_gather_phone_number"}],"description":"Ask what the user wants to convey to the manager and use any available BusinessContext/AdditionalInformation; if needed, reconfirm or collect their name and phone number. Let them know you’ll pass the message along, clarify that reschedules/changes aren’t final until a human confirms, ask if they need anything else, and then finish the conversation.","is_from_library":true,"origin_idn":""},{"idn":"scenario_sales_finish_conversation","title":"## **Scenario 20:** \"Finish Conversation\"","body":"### **Step 20.1:** Ask if you could help the User with something else, then ask one short, natural follow-up question inviting the User to continue if needed. Keep it concise, polite, and conversational.\n- Use varied follow-up questions and rotate naturally between different phrasings.\n- If the User asks a new question, raises a new concern, or makes a new request, pause the closing flow and address that request first.\n- **Do not repeat** or overuse the same follow-up wording, especially in consecutive replies or in near-identical form.\n\nExamples:\n- \"Do you have any other questions?\"\n- \"What would you like to know next?\"\n- \"Anything else you''d like to know?\"\n- \"How can I help further?\"\n- \"Would you like to ask about anything else?\"\n\n**CRITICAL**: You must STOP your response here. **Do NOT** look ahead to **Step 20.2**. You are FORBIDDEN from saying goodbye or wishing a great day in this turn.\n\n**CRITICAL INTERPRETATION RULE (END CONFIRMATION):**\nYou may treat the conversation as ending ONLY if the User explicitly says one of: \"No\", \"No thanks\", \"That''s it\", \"Nothing else\", \"We can hang up now\", \"You can hang up\", \"Goodbye\", \"Bye\", or another clear equivalent meaning they do not want to continue right now.\n\n**CRITICAL INTERPRETATION RULE (DO NOT END):**\nIf the User asks to wait, to try something first, to stay on the line, to continue, or asks any question, you MUST NOT proceed to Step 20.2.\n\n- If the User says \"Yes\", or similar, asks a question, or makes a new request: answer that question or handle that request first. **Do NOT** proceed to **Step 20.2**.\n\n- If the User only asks you to wait, to stay on the line, or to continue without asking anything specific: briefly acknowledge that and, if helpful, ask one short follow-up question, for example: \"Sure, no worries, I’m here if you need a hand\".\n\n- If the User explicitly says any of the END CONFIRMATION phrases above: Proceed to Step 20.2.\n\n- If the User says \"Thanks\" / \"Thank you\": Do NOT treat this as the end. Ask one clarifying question like: \"You''re very welcome! Is there anything else on your mind that I can assist with?\"\n\n### **Step 20.2:** Only reach this if Step 20.1 confirmed the end using the explicit phrases listed in **CRITICAL INTERPRETATION RULE (END CONFIRMATION)** above and there is no unresolved request from the User. Express enthusiastic gratitude for the actions the User has taken and ask: \"Lastly, I have a very delicate question for you - but it''s important. How would you rate me and our conversation from 0 to 10? I really need your feedback to keep improving.\"\n\n### **Step 20.3:** Ask how they heard about us.\n\n### **Step 20.4:** Warmly thank them for their answer and say that the world is changing right before our eyes, and we will transform it together.\n- If this was an appointment booking, express excitement about the upcoming meeting - e.g.: \"We look forward to seeing you! [add a personal positive note]. Have a great day!\". You must explicitly say goodbye at the end of the conversation.","mentions":[],"description":"Wrap up the conversation by asking if there’s anything else you can help with, requesting a 0–10 rating with feedback, and asking how they heard about you. Then warmly thank them, note that we’re transforming the world together, and—if an appointment was booked—express excitement about the upcoming meeting.","is_from_library":true,"origin_idn":""}]},{"idn":"procedures","title":"Procedures","description":"Procedures are reusable conversational subroutines that represent standardized logic blocks performing common actions across multiple scenarios. They are designed to avoid duplicating logic and ensure consistent handling of repeated behaviors, such as confirming names, collecting phone numbers, or verifying contact information.\n\nPrimary objective:\n* Maintain conversation quality and consistency by:\n* Standardizing repeated conversational actions across scenarios\n* Eliminating duplicate logic across the system\n* Ensuring uniform handling of common behaviors (e.g., name confirmation, phone collection, contact verification)\n* Adapting based on information already available in Customer Attributes\n\nProcedures must remain generic and scenario-independent, functioning reliably regardless of which scenario invokes them.\n\nFormatting rules:\n1. Title\nAlways use: ## **<Procedure Name>** procedure\n\nExample: ## **Reconfirming or Gathering User Name** procedure\n\n2. Body (Instructions)\nEach procedure body must clearly define:\n* When the procedure should be invoked\n* What conditions should be checked before execution\n* What the AI Employee should say or do in each case\n* Conditional logic with example phrasing to maintain conversation quality\n\nAttribute references and context injection\nProcedures can reference Attributes using the format: [[attribute Idn]]\nExample: [[project_attributes_restaurant_large_group_reservation_minimum_party_size]]\n\nContext from the conversation or additional instructions can be injected into a procedure using the format [context/instruction].\nExample: “Ask the user, your address is [user address], and you will be available on [availability date], is that correct?”\n\nFor more info follow: https://help.newo.ai/en/articles/13786232-procedure-formatting","color":"#155DFC","items":[{"idn":"procedure_common_gather_date_time_sales","title":"## **Gathering Preferred Date and Time** procedure","body":"When you need to gather a preferred date and time for a new appointment, you must attend to information under **Working Hours** (<WorkingSchedule> section) and explicitly tell the User that they can choose a time in [working days] at [working hours, and mention the time zone ''conversation.timezone'' in the 3 letter abbreviation format ex PDT, CET]. You can suggest only a time that is at least half an hour later than the `conversation.time` in <ConversationMeta>, fits the business working schedule, and is offered with a proposal wording such as \"Would you consider...\"\n\n- **First of all** ask the User to provide some preferred date and time as follows:\n\"Do you have a particular day or time in mind for your appointment?\"\n\n- If the User has provided a day in terms like: \"today\", \"tomorrow\", \"the day after tomorrow\", \"the next [day of week]\"... you need to use <ConvoAgentCalendar> to ensure you interpret it correctly and reconfirm a date and time the User has chosen as follows:\n\"Do you mean [user''s preferred day of the week according to <ConvoAgentCalendar>] [user''s preferred date according to <ConvoAgentCalendar>] at [user''s preferred mention the time zone ''conversation.timezone'' ex: \"Pacific Time\", \"Central European Time\"]?\"","mentions":[],"description":"This procedure collects the user’s preferred Date and Time, asking only for missing details, interpreting relative days with <ConvoAgentCalendar>, and reconfirming: “Do you mean [weekday] [date] at [time]?” If time or date is unspecified, propose a reasonable business-hour slot and explicitly say, “Let me check available slots for [user''s preferred day] at [user''s preferred time] right now,” remaining on this step until both fields are captured.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_email","title":"## **Reconfirming or Gathering Email Address** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<Conversation>**, and **<UserInformation>** section for an explicit, valid email string.\n\n**CRITICAL VALIDATION:** A valid email MUST contain an \"@\" symbol and a \".\" (dot) that is positioned AFTER the \"@\" and BETWEEN characters (e.g., \"name@domain.com\"). Strings like \"name@com\" or \"name@domain.\" are INVALID.\n\nConvoAgent must not rely on the User''s claim that they \"sent it\" unless the actual email text is visible. Follow the rules:\n\n- Rule 1: **Email string is MISSING or INVALID (e.g., no dot after the \"@\"):**\n\n  - If `conversation.channel` in <ConversationMeta> is set to **PHONE**: Say the **code-phrase**: \"Give me a moment, I will send you an SMS message please reply with your email address.\"\n    - **Stay on this Rule 1** until an email with both \"@\" and a \".\" after it is visible. **Do not proceed to Rule 2 if the dot is missing.**\n    - If ConvoAgent is having trouble receiving the User''s email address via SMS, ConvoAgent should ask the User to spell out their email address verbally, letter-by-letter.\n\n  - If `conversation.channel` in <ConversationMeta> is set to **CHAT**: Ask the user to provide a valid email in the chat.\n    - If the user provides a valid email in the current turn, treat it as gathered immediately.\n\n- Rule 2: **A valid email string is present:**\n  - If `conversation.channel` in <ConversationMeta> is set to **PHONE**: Say: \"I see your email address...\" and **spell it out character by character**. Then ask: \"May I use this email address?\"\n\n  - If a valid email string is present and `conversation.channel` in <ConversationMeta> is set to **CHAT**: Do not reconfirm the email. Do not ask the user to repeat it. Treat the email as already gathered and proceed directly to the next step.","mentions":[],"description":"The procedure tells the agent to look for a visible, valid email address in <Conversation>, <PreviousConversationSummary>, or <UserInformation>. If it is still missing or invalid, ask for a valid email and stay on this step until one is visible. On phone, read a valid email out character by character and ask permission to use it; in chat, never reconfirm or ask the user to repeat a valid email that is already available, and proceed to the next step immediately.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_name","title":"## **Reconfirming or Gathering User Name** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<UserInformation>** section, and **<Conversation>** for the User''s name. Follow the rules:\n\n- Rule 1: **If the User’s name is not known from the sources above (<PreviousConversationSummary>, <UserInformation>, or <Conversation>)**: ask, may I have your name, please?\n  - If the user provides a name in the current turn, treat it as gathered immediately.\n  - It is okay if the user provides a first name only.\n\n- Rule 2: If the User’s name is already known and `conversation.channel` in <ConversationMeta> is set to **PHONE**:\n  - Reconfirm the name with the user, e.g.: \"Your name is [user.full_name], is that correct?\"\n\n- Rule 3: If the User’s name is already known and `conversation.channel` in <ConversationMeta> is set to **CHAT**:\n  - Do not reconfirm the name.\n  - Do not ask the user to repeat it.\n  - Treat the name as already gathered and proceed directly to the next step.","mentions":[],"description":"When you need a user’s name, first check whether it is already present in <PreviousConversationSummary>, <UserInformation>, or <Conversation>. Ask for the name only if it is still missing. On phone, reconfirm an already known name once; in chat, never reconfirm or ask the user to repeat a name that is already available. First name alone is acceptable.","is_from_library":true,"origin_idn":""},{"idn":"procedure_common_gather_phone_number","title":"## **Reconfirming or Gathering Phone Number** procedure","body":"Before proceeding, check the **<PreviousConversationSummary>** section, **<UserInformation>** section, and **<Conversation>**. **DO NOT** use the business phone number from <BusinessContext>. Follow the rules:\n\n- Rule 1: If `conversation.channel` in <ConversationMeta> is set to **PHONE:** - Proceed to **Step 1.**\n\n- Rule 2: If `conversation.channel` in <ConversationMeta> is set to **CHAT:** - Proceed to **Step 2.**\n\n### **Step 1:**\n  - **First-reconfirmation null-state rule.** If `user.provided_phone_number` is `null` when you need to read back the number (typically on the first reconfirmation right after the user provides a number), read back exactly the digits the user just spoke during the most recent turn — including any country-code digits they pronounced. Wait for confirmation; on subsequent turns `user.provided_phone_number` will be populated and the rules below apply.\n  - **If the User asks to change/update their phone number or provides a new phone number:** reconfirm it once digit-by-digit by reading the digits in `user.provided_phone_number` exactly as stored. Do not add or remove digit characters. Say: \"Let me make sure I got that right: [repeat digits from user.provided_phone_number, digit-by-digit, exactly as stored]. Is that correct?\" Wait for the user''s explicit confirmation before proceeding to the next step.\n  - **If `user.detected_phone_number` is not `null`, reconfirm permission to use it - e.g.:** \"I see your phone number is [user.detected_phone_number]. May I use it?\"\n  - **If `user.detected_phone_number` is `null`, request to provide phone number - e.g.:** \"Could you share a phone number we can use to stay in touch? Spell the phone number please.\". **After they provide it, reconfirm it digit-by-digit by reading the digits in `user.provided_phone_number` exactly as stored, e.g.:** \"Let me make sure I got that right: [repeat digits from user.provided_phone_number, digit-by-digit, exactly as stored]. Is that correct?\" Reconfirm even if the number sounds short or partial — the spell-back is what surfaces missing or incorrect digits.\n  - **If `user.provided_phone_number` is already known, but requires validation, say:** \"Just to be safe, let me make sure I have your number right: [repeat digits from user.provided_phone_number, digit-by-digit, exactly as stored]. Is that correct?\"\n\n### **Step 2:**\n  - **If the User asks to change/update their phone number or provides a new phone number:** accept it, treat it as gathered immediately, and proceed to the next step. **Do not repeat it back or ask for confirmation.**\n  - **If `user.detected_phone_number` is already known:** treat it as already gathered and proceed to the next step. **Do not ask the user to repeat it or confirm it.**\n  - **If `user.detected_phone_number` is `null`, request to provide phone number - e.g.:** \"Could you share a phone number we can use to stay in touch?\"\n  - **After they provide it in chat, do not repeat the number back or ask for confirmation.**\n  - **Proceed to the next Step.**","mentions":[],"description":"Use the conversation channel and <UserInformation> to determine how to handle the phone number. In chat, ask for it only if it is still missing, and if a number is already available or the user provides one in the current turn, treat it as gathered and proceed without repeating or reconfirming it. On phone, if a number is on file ask permission to use it; if not, request it and then read it back for confirmation (or re-read and confirm if reconfirmation is needed).","is_from_library":true,"origin_idn":""}]},{"idn":"csv_outbound","title":"Outbound Calls CSV files","description":"Outbound Call CSV Batches\n\nCreate an outbound batch:\n1. **Enter a Title** for the batch (e.g., `Leads Batch 1`).\n2. **Paste your structured CSV data** into the **Body** field.\n3. Click **Save**.\n\n✅ Once saved, the **AI Employee** analyzes the data and queues the calls.\nYou can create multiple batches by adding new items to the **Outbound Call CSV files** column.\n\nCSV format requirements\nYour data in the **Body** field must be formatted as **standard CSV**.\n\nRequired rules:\n\n- **Header row:** Include a header row to define column names (e.g., `Phone Number`, `Reason to Call`).\n  This helps the agent accurately identify the data.\n- **Phone numbers:** Ensure phone numbers are in a valid **international format** (include the country code like `+1...`).\n  Invalid formats may prevent the call from being placed.\n\n❗❗ IMPORTANT\n- **Avoid duplicate phone numbers** in the CSV.\n  Duplicates can cause issues with calling logic and result tracking.\n\nExample CSV data\n\nPhone Number,Reason to Call\n+1234567890,Follow up regarding the recent laptop purchase. Ask if they are satisfied with the service.\n+1987654321,Check in regarding their account. Inform them the account has been upgraded to premium status.\n\n\nRetrieve call results\nOnce the agent processes the calls, the results are written to a **project attribute**.\n\n1. Navigate to the **Attributes** page.\n2. Search for: `project_attributes_outbound_call_table_csv_result`\n3. Copy the content from the attribute value.\n4. Save the content as a `.csv` file (e.g., `results.csv`) and open it in spreadsheet software for analysis.\n\n🗒️ Note\n\nIf your list contains many entries (typically **more than 50**), the system will automatically generate multiple result attributes (e.g., `..._batch_1`, `..._batch_2`) to store the data.\n\nFor more info follow: https://help.newo.ai/en/articles/13786164-outbound-calling-via-csv-list","color":"#a9049eff","items":[{"idn":"54f406b9-c9ea-41d8-8fa7-00a720aadd78","mentions":[],"title":"1 (sent)","body":"Phone Number,Reason to Call\n+380960229180,Follow up regarding the recent laptop purchase. Ask if they are satisfied with the service.","is_from_library":false,"origin_idn":""}]},{"idn":"csv_outbound_sms","title":"Outbound SMS CSV files","description":"Outbound SMS CSV Batches\n\nCreate an outbound batch:\n\n1. **Enter a Title** for the batch (e.g., `Leads Batch 1`).\n2. **Paste your structured CSV data** into the **Body** field.\n3. Click **Save**.\n\n✅ Once saved, the **AI Employee** analyzes the data and queues the SMS messages.\nYou can create multiple batches by adding new items to the **Outbound SMS CSV files** column.\n\nCSV format requirements\n\nYour data in the **Body** field must be formatted as **standard CSV**.\n\nRequired rules\n\n- **Header row:** Include a header row to define column names (e.g., `Phone Number`, `Reason`).\n  This helps the agent accurately identify the data.\n- **Phone numbers:** Ensure phone numbers are in a valid **international format** (include the country code like `+1...`).\n  Invalid formats may prevent the SMS from being sent.\n\n❗❗ IMPORTANT\n- **Avoid duplicate phone numbers** in the CSV.\n  Duplicates can cause issues with calling logic and result tracking.\n\nExample CSV data:\nPhone Number,Reason\n+1234567890,Follow up regarding the recent laptop purchase. Ask if they are satisfied with the service.\n+1987654321,Check in regarding their account. Inform them the account has been upgraded to premium status.\n\nRetrieve SMS results\nOnce the agent processes the SMS batch (and any associated calls, if applicable), the results are written to a shared **project attribute** used for both outbound calls and SMS.\n1. Navigate to the **Attributes** page.\n2. Search for: `project_attributes_outbound_call_table_csv_result` (this attribute stores the results for both outbound calls and SMS batches).\n3. Copy the content from the attribute value.\n4. Save the content as a `.csv` file (e.g., `results.csv`) and open it in spreadsheet software for analysis.\n\n🗒️ Note\n\nIf your list contains many entries (typically **more than 50**), the system will automatically generate multiple result attributes (e.g., `..._batch_1`, `..._batch_2`) to store the data.\n\nFor more info follow: https://help.newo.ai/en/articles/13786164-outbound-calling-via-csv-list","color":"#a9049eff","items":[]}]}'
    title: Dynamic - Workflow Builder - Canvas [C]
    description: |-
      This advanced system configuration stores the current Workflow Builder canvas state used to
      represent your intent/scenario/procedure structure.

      **Note:** This is a system-managed internal attribute. Its value is generated and updated
      automatically and can be overwritten by runtime workflows. Do not edit this attribute manually.

      **Best Practice:** Treat this as system-managed JSON and update it through Workflow Builder actions
      instead of manual edits.

      Example value:

      ```json
      {
        "title": "Workflow Builder",
        "types": [
          {
            "idn": "intent_types",
            "items": []
          },
          {
            "idn": "scenarios",
            "items": []
          }
        ]
      }
      ```

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Workflow-builder initialization sends this JSON to the builder UI, while
      save/delete actions mutate it incrementally. Instruction-preparation logic uses this canvas to
      derive ITM/AMI templates and trigger downstream instruction/ITM rebuild events. Report-intent
      analysis logic also reads canvas intent/scenario definitions. Some module-specific follow-up flows
      can edit the stored canvas after builder rebuild and then trigger instruction recompilation so
      runtime instructions stay aligned.

      **Fallbacks:** Initialized as a blank placeholder during common setup. If empty during instruction
      preparation, the system generates a default canvas based on industry templates.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_industry`: Selects default canvas content when initialization/rebuild is done
          from library templates.
      - **Logic Interactions:**
        - `gm_prepare_instructions`: Event-driven rebuild path that initializes or refreshes this canvas.
        - `gm_build_instructions`: Event-driven path that compiles instructions from current canvas state.
        - `gm_prepare_itm`: Triggered after canvas-derived ITM templates are prepared.
    group: 8. System
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.json"
  - idn: project_attributes_setting_email_sender_name
    value: Нафтогаз України | DoNotReply
    title: Email - Sender Name [A]
    description: |-
      This setting defines the sender display name shown on outgoing emails.

      **Best Practice:** Use a clear business-aligned sender name so users can easily recognize automated
      messages.

      Example values:

      - `Your Company Name | DoNotReply`
      - `Appointments Team | DoNotReply`

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Email delivery runtime reads this value and passes it as `senderName` in outgoing
      email requests.

      **Fallbacks:** Common setup initializes this field from business name using a DoNotReply postfix. If
      empty at send time, runtime falls back to a generic sender name.

      **Dependencies:**

      - **Primary Settings:**
        - `project_business_name`: Used during initialization to construct default sender naming.
      - **Logic Interactions:**
        - Affects email sender display only; it does not change recipient targeting or opt-out checks.
    group: 4. Agent Behavior - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
  - idn: project_attributes_private_feature_flag_booking_use_new_availability_formatted_response_processor
    value: "False"
    title: Feature Flag - Booking - Use New Availability Formatted Response Processor
      [C]
    description: |-
      This advanced system configuration selects which formatted-response availability processor is used
      at runtime.

      **Best Practice:** Turn this on only when your availability endpoint returns payloads compatible
      with the newer formatted-response structure.

      Behavior by value:

      - **Enabled (`True`)**: Uses the newer formatted-response availability processor.
      - **Disabled (`False`)**: Uses the legacy formatted-response availability processor.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Availability-receive flows check this flag when processing type is
      `formatted_response` and route output parsing through either the new or legacy formatted-response
      handler in system/project/default availability paths. Intercom-specific availability result handling
      also uses this flag to choose between the new and legacy formatted-response processors.

      **Fallbacks:** Default is `False` during common setup. In system/project/default availability paths,
      if processing type is not `formatted_response`, this flag has no effect. If enabled against an
      incompatible payload shape, availability interpretation can degrade and lead to missing/incorrect
      slot context.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_booking_check_availability_processing_type`: Controls whether this
          feature-flag switch is applied in system/project/default availability paths.
        - `project_attributes_setting_booking_check_availability_type`: Determines which availability
          channel path applies the new-vs-legacy formatted-response processor decision.
      - **Logic Interactions:**
        - `project_attributes_setting_time_format`: Parsed slot responses are later communicated using
          this configured time format.
        - `project_business_industry`: Restaurant-specific post-processing can run after
          formatted-response parsing.
