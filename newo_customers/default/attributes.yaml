  - idn: project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_set_turn_message_context_type
    value: user
    title: |-
      Voice - Integration Service - Voice To Voice Provider - GenAI - Set Turn Message Context
      Type [C]
    description: |-
      This advanced setting controls which message role is used when context is injected into GenAI
      `voice-to-voice` turns.

      Use it to define whether injected context is sent as `user` or `assistant` role in
      `set_turn_message` context updates.

      Behavior by value:

      - **`user`:** Context is injected using the user role for GenAI voice context turns.
      - **`assistant`:** Context is injected using the assistant role for GenAI voice context turns.

      **Best Practice:** Keep this aligned with your GenAI prompt strategy and test with live voice calls
      before changing globally.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** GenAI context-injection paths read this attribute before sending a
      `set_turn_message` command with `turnComplete=False`. The same role decision is used both by direct
      voice-context updates and by the `convoagent_send_context` event path.

      **Fallbacks:** Common settings initialization sets the default value to `user`. If the current
      voice-to-voice provider is not `genai`, context injection falls back to the `assistant` role instead
      of reading this attribute.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_set_turn_message_type`:
          Companion advanced configuration for command-role routing in the same GenAI voice-to-voice flow.
      - **Logic Interactions:**
        - `convoagent_send_context`: Event-driven context injection path that uses this role decision.
    group: 8. System
    is_hidden: true
    possible_values:
      - assistant
      - user
    value_type: !enum "AttributeValueTypes.enum"
  - idn: project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_set_turn_message_type
    value: user
    title: Voice - Integration Service - Voice To Voice Provider - GenAI - Set Turn
      Message Type [C]
    description: |-
      This advanced setting controls which message role is used when command instructions are sent to
      GenAI `voice-to-voice` sessions.

      It determines how command turns are delivered in `set_turn_message` calls for the GenAI provider.

      Behavior by value:

      - **`user`:** Sends command turns through the user-role command path.
      - **`assistant`:** Sends command turns through the assistant-role command path.

      **Best Practice:** Keep `user` unless you have validated that assistant-role command turns improve
      your provider behavior in production-like voice sessions.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** GenAI command-dispatch logic checks this attribute and routes to user-role or
      assistant-role command senders accordingly. Both senders deliver the same command text through
      `set_turn_message`, while the assistant-role path marks the turn complete.

      **Fallbacks:** Common settings initialization sets the default value to `user`. This role selector
      is consulted only when the current voice-to-voice provider resolves to `genai`.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_set_turn_message_context_type`:
          Companion advanced configuration for context-role routing in the same GenAI voice-to-voice flow.
      - **Logic Interactions:**
        - `set_turn_message`: Voice command used to deliver the final command turn to the active GenAI
          connector.
    group: 8. System
    is_hidden: true
    possible_values:
      - user
      - assistant
    value_type: !enum "AttributeValueTypes.enum"
  - idn: project_attributes_setting_voice_integration_service_voice_to_voice_provider
    value: genai
    title: Voice - Integration Service - Voice To Voice Provider [C] [IMPORTANT]
    description: |-
      Selects the active provider for `voice-to-voice` operation in the platform-native voice path.

      **Pro-Tip:** Keep provider choice aligned with your preferred voice catalog and reliability
      requirements.

      **Examples:**

      - **`genai`:** Uses GenAI voice-to-voice provider path.
      - **`grok`:** Uses Grok voice-to-voice provider path.
      - **`openai`:** Uses OpenAI voice-to-voice provider path.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Synced to connector `v2v_mode` settings and used as the fallback provider source
      when session-level provider state is not already set by connector context.

      **Fallbacks:** Default initialization sets `genai`. Runtime can override provider per session using
      connector fallback settings when enabled.

      **Dependencies:**

      - **Primary Settings:**
        - When the advanced system configuration
          `project_attributes_setting_voice_integration_service_voice_mode` is enabled with
          `voice-to-voice`, this provider setting is used for session-level provider resolution.
        - `speech-to-speech` provider selection is managed by native voice connector settings and is not
          controlled by this attribute.
        - When the advanced system configuration `project_attributes_setting_voice_integration_service` is
          enabled with the platform-native voice integration option, this provider setting applies to
          voice-to-voice native voice channels.
      - **Logic Interactions:**
        - When the advanced system configuration
          `project_attributes_setting_voice_integration_service_voice_to_voice_provider_genai_voice` is
          updated, connector-sync flows propagate it to the native connector GenAI voice setting.
        - When the advanced system configuration
          `project_attributes_setting_voice_integration_service_voice_to_voice_provider_grok_voice` is
          updated, connector-sync flows propagate it to the native connector Grok voice setting.
        - When the advanced system configuration
          `project_attributes_setting_voice_integration_service_voice_to_voice_provider_openai_voice` is
          updated, connector-sync flows propagate it to the native connector OpenAI voice setting.
    group: 2. Agent - Advanced
    is_hidden: true
    possible_values:
      - openai
      - genai
      - grok
    value_type: !enum "AttributeValueTypes.enum"
  - idn: project_attributes_setting_voice_integration_service
    value: NEWO Voice Integration
    title: Voice - Integration Service [C] [IMPORTANT]
    description: |-
      Selects which voice-integration backend the Agent uses for call operations.

      **Pro-Tip:** Keep this stable in production. Changing it affects command routing for transfer,
      hang-up, and telephony-related actions.

      **Examples:**

      - **External integration value:** Uses external connector command routing.
      - **Platform-native integration value:** Uses native connector command routing and advanced voice
        mode controls.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Determines which connector/integration receives voice commands (for example,
      `stop_call`, `transfer_call`, and dialpad behavior). Conversation-start flows can auto-update this
      value based on the active channel integration. It is also used when creating/selecting SMS-related
      voice actors and when resolving the source of the Agent voice phone number during setup.

      **Fallbacks:** Default initialization sets the platform-native voice integration value. Runtime
      start skills may override it when a different integration channel is detected.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_voice_integration_service_voice_mode`: Applied with the
          platform-native voice integration path.
        - `project_attributes_setting_voice_integration_service_bypass_phone_number`: Synced to connector
          emergency/bypass routing settings.
      - **Logic Interactions:**
        - `project_attributes_setting_voice_transfer_call_timeout`: Used in transfer commands for the
          platform-native integration path.
        - `project_attributes_setting_voice_stop_call_timeout`: Used in stop-call commands for the
          platform-native integration path.
    group: 2. Agent - Advanced
    is_hidden: true
    possible_values:
      - VAPI Integration
      - NEWO Voice Integration
    value_type: !enum "AttributeValueTypes.enum"
  - idn: project_attributes_setting_voice_stop_call_timeout
    value: "6"
    title: Voice - Stop Call Timeout [C]
    description: |-
      This setting defines how long runtime waits (in seconds) before finalizing call-stop behavior in
      voice channels that use native voice connectors.

      **Best Practice:** Set this slightly above your typical closing phrase length so the Agent can
      finish speaking before stop-call execution.

      Behavior by value:

      - **Positive number:** Applied as stop-call wait timing for supported voice stop paths.
      - **Empty value:** Runtime falls back to default stop timeout behavior.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Used in stop-call command paths for phone and webcall hang-up flows on native
      voice connectors. Also used in voicemail/spam handling logic for non-outbound scenarios before
      issuing stop-call.

      **Fallbacks:** Initialized to `6` in common defaults. Runtime also falls back to `6` when this field
      is empty at execution time.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_voice_integration_service`: Provider selection determines whether
          this timeout is applied on phone-channel stop-call commands.
        - `project_attributes_setting_check_spam_or_voicemail`: Voicemail/spam handling can reuse this
          timeout for stop-call timing.
      - **Logic Interactions:**
        - `commandIdn="stop_call"`: Receives this value in supported native voice stop-call paths.
        - `convoagent_update_followup`: Hang-up flows disable follow-up after stop-call execution.
    group: 4. Agent Behavior - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_attributes_setting_voice_transfer_call_timeout
    value: "6"
    title: Voice - Transfer Call Timeout [C]
    description: |-
      This setting defines how long runtime waits (in seconds) when executing call transfer on supported
      voice integration paths.

      **Best Practice:** Match this value to transfer-announcement length so transfer command timing does
      not cut off critical phrasing.

      Behavior by value:

      - **Positive number:** Applied as transfer wait timing on supported transfer command paths.
      - **Empty value:** Runtime falls back to default transfer timeout behavior.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Applied to transfer command execution in native voice transfer flow via
      `waitForTransferSeconds`.

      **Fallbacks:** Initialized to `6` in common defaults. Runtime also falls back to `6` when this field
      is empty at execution time.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_voice_integration_service`: This timeout is used on native voice
          transfer path; other providers can ignore it.
        - `project_attributes_setting_transfer_call_enabled`: Transfer command path must be enabled to use
          this timeout.
      - **Logic Interactions:**
        - `commandIdn="transfer_call"`: Receives this value in supported native voice transfer execution.
        - `project_attributes_setting_transfer_call_phone_numbers`: Transfer-number selection logic
          affects whether transfer execution (and this timeout) is reached.
    group: 4. Agent Behavior - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
