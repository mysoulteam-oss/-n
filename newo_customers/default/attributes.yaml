  - idn: project_attributes_setting_blocked_phone_numbers
    value: "[]"
    title: Phone - Blocked Numbers [A]
    description: |-
      Use this list to block specific phone numbers from interacting with your voice Agent. Blocked
      callers are disconnected automatically when they start a call.

      **Best Practice:** Save numbers in full international format and keep the format consistent with how
      your telephony integration sends caller IDs.

      How this list is used:

      - Numbers in this list are proactively blocked on call start.
      - Numbers can also be added automatically when repeated spam sessions reach your configured spam
        threshold.

      **Example:**

      ```json
      ["13334445556", "12223334455"]
      ```

      **Format options (for each phone number in the list):**

      - With plus: `+12223334444`
      - Without plus: `12223334444`

      Both formats are accepted, but include full country code for every entry.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** On voice-call start, the system checks whether the caller external ID exactly
      matches any item in this array. If matched, it triggers a stop-call command for the active voice
      integration.

      **Fallbacks:** Initialized as an empty array. If empty, no proactive blocking is applied. During
      spam-limit enforcement, missing/empty values are treated as an empty list before updates.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_spam_limit`: Reaching the configured threshold appends the user's
          phone number to this list.
        - `project_attributes_setting_voice_integration_service`: Determines which voice integration
          connector receives the stop-call command.
      - **Logic Interactions:**
        - Caller identifier matching is exact string comparison (no normalization at runtime).
    group: 4. Agent Behavior - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.json"
  - idn: project_attributes_setting_phone_dialpad_output_enabled
    value: "False"
    title: Phone - Dialpad Output [C]
    description: |-
      This setting controls whether the Agent can send DTMF/dialpad digits during phone conversations.

      **Best Practice:** Enable only for tested phone workflows that explicitly require keypad digit entry
      (for example IVR verification steps).

      Behavior by value:

      - **Enabled (`True`):** Agent can attempt dialpad output when conversation context indicates it is
        required.
      - **Disabled (`False`):** Dialpad output path is blocked.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** In phone-channel analysis, runtime checks whether dialpad output is needed and, if
      approved, sends `dial_digits` command to the voice connector with extracted digits.

      **Fallbacks:** Initialized to `False` in common defaults. If channel/provider prerequisites are not
      met, runtime exits without sending dialpad output even when enabled.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_voice_integration_service`: Dialpad command path is available only
          for the supported voice integration provider.
      - **Logic Interactions:**
        - `broadcast_analyze_conversation`: Event path where dialpad-need analysis is evaluated for phone
          turns.
        - `commandIdn="dial_digits"`: Execution command used to emit keypad digits.
    group: 4. Agent Behavior - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.bool"
  - idn: project_attributes_setting_spam_limit
    value: "5"
    title: Phone - Spam Limit [A]
    description: |-
      This setting defines how many consecutive spam-classified sessions are allowed before a user's phone
      number is automatically blocked.

      **Best Practice:** Use a positive value to limit abuse while reducing false positives. Set `-1` only
      if you want to fully disable automatic spam-based blocking.

      Behavior by value:

      - **`-1`:** Automatic blocking by spam threshold is disabled.
      - **`0` or higher integer:** The system counts consecutive spam sessions and blocks when threshold
        is reached.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** Evaluated at session end. If session type contains `spam`, the persona-level
      `spam_counter` is incremented. When threshold is reached, the system appends the user's phone to
      `project_attributes_setting_blocked_phone_numbers`, sends a system log, and resets the counter.
      Non-spam sessions reset the counter to zero.

      **Fallbacks:** Initialized with a default numeric threshold during account setup. Automatic blocking
      is skipped for temporal personas and for sessions where a usable phone number is unavailable.

      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_setting_blocked_phone_numbers`: Target list updated when threshold is
          reached.
      - **Logic Interactions:**
        - `project_attributes_setting_check_spam_or_voicemail`: Influences spam/voicemail classification
          inputs that ultimately affect session-type spam labeling.
        - Session semaphore `sessionType`: Spam counter logic activates only when this classification
          includes `spam`.
    group: 4. Agent Behavior - Advanced
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.number"
  - idn: project_attributes_products_and_services_served_area
    value: " "
    title: Products & Services - Area Served [A]
    description: |-
      Describe the general geographic area where your products or services are available.

      **Pro-Tip:** Be explicit about radius, cities, or regions so service-availability checks remain
