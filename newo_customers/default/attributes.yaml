      **Dependencies:**

      - **Primary Settings:**
        - `project_attributes_products_and_services`: Main source for offered products/services.
        - `project_attributes_products_and_services_not_offering`: Main source for explicitly excluded
          products/services.
      - **Logic Interactions:**
