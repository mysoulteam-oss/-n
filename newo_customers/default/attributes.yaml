  - idn: project_attributes_private_dynamic_itm_compiled
    value: |-
      ## **[L] Sale to a Client**
      The end customer or buyer is asking questions about the product, wants to purchase, order, reserve, subscribe, or is still undecided about their intention.
      ConvoAgent starts the scenario: **"Consultation and Lead Qualification"** and after that switches to the **Closing...** intent.

      ## **[L] Closing via Appointment**
      The user shows a clear intent to purchase a specific product, interested in a Demo, talking to a human expert or is ready to take the next step and schedule a meeting with a consultant.
      ConvoAgent starts the scenario: **"Appointment Setting via Calendar Invite"**

      ## **[L] Closing via Product Link**
      The user shows clear intent to purchase / sign up to a specific product or the user is requesting additional information about products and services, such as pricing, documentation, e-books, videos, etc.
      ConvoAgent starts the scenario: **"Sending the Product Link"**

      ## **Spam Session**
      The caller is clearly attempting to sell something, conduct telemarketing, running a scam, or is an unsolicited robocall unrelated to our services. Unclear, garbled, or nonsensical speech is NOT spam - it indicates transcription issues.
      ConvoAgent responds with something like: *"I'm afraid I can't assist you with that"* and informs that it ends the conversation now.

      ## **Test Session**
      A call from a phone number on the test number list or a session where the caller explicitly mentioned it was a test.
      ConvoAgent says: *"Thank you for your cooperation"* and then starts the scenario: **"Finish Conversation"**.

      ## **Other type of session**
      Any type of session not covered by the categories listed above.
      ConvoAgent should say that it cannot assist with this request, needs to pass the information to a co-worker, and start the scenario: **"Relaying Message to the Manager"**.
    title: ITM - Compiled [C]
    description: |-
      This attribute stores the compiled ITM (Intention Type Map) that runtime workflows use as the base
      intent map. The value is generated automatically from the ITM template and updated when workflow
      instructions are rebuilt.

      **Note:** This is a system-managed internal attribute. Its value is generated and updated
      automatically and can be overwritten by runtime workflows. Do not edit this attribute manually.

      **Examples:**

      - After intent-type updates are saved, the system recompiles this ITM and refreshes downstream
        intent-map outputs.
      - If the source template contains placeholders like `[[project_business_name]]`, this compiled ITM
        stores the resolved text after replacement with current Customer Attribute values.

      ---

      **⚙️ Technical & System Details (Advanced)**

      **System Usage:** The system compiles `project_attributes_private_dynamic_itm_template` into this
      attribute, then uses this compiled map as input for downstream ITM preparation. That preparation
      workflow derives both `project_attributes_private_dynamic_itm_non_working_hours_compiled` and
      `project_attributes_private_dynamic_itm_working_hours_compiled`, and refreshes stored intent entries
      for intent-processing workflows. Assessment workflows also read this compiled ITM value.

      **Fallbacks:** During initialization, if this attribute is missing, the system seeds it with a
      whitespace placeholder until compilation runs.

      **Dependencies:**

      - **Primary Settings:**
        - No direct customer-facing settings are required.
      - **Logic Interactions:**
        - `project_attributes_private_dynamic_itm_template`: Source template compiled into this attribute.
        - `project_attributes_private_dynamic_itm_non_working_hours_compiled`: Derived downstream from
          this compiled ITM for non-working-hours routing.
        - `project_attributes_private_dynamic_itm_working_hours_compiled`: Derived downstream from this
          compiled ITM for working-hours routing.
        - `project_attributes_private_dynamic_intents_list`: Refreshed from this compiled ITM when intent
          entries are rebuilt.
        - Referenced Customer Attributes in `[[attribute_idn]]` placeholders: Their values are injected
          into this compiled output during compilation.
    group: 8. System
    is_hidden: true
    possible_values: []
    value_type: !enum "AttributeValueTypes.string"
